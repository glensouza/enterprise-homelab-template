name: PR Preview Deploy

# ADR 19 / docs/11: every open PR gets an isolated Docker compose stack on
# the single non-prod preview host (10.10.140.120), reachable over trusted
# HTTPS at https://pr-<n>.pr.brewhouse.internal (Technitium wildcard DNS +
# step-ca certificates). Runs on the self-hosted runner because the preview
# host lives on the private LAN. Teardown lives in pr-preview-cleanup.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

env:
  PREVIEW_HOST: 10.10.140.120
  PKI_HOST: 10.10.130.121
  STEP_CA_URL: https://10.10.130.121:4443
  PREVIEW_DOMAIN: pr.brewhouse.internal
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    runs-on: self-hosted
    environment: preview
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # DCP/GHCR workaround (see deploy-blazor.yml for the full explanation) -
    # needed here too since this runs the same test suite.
    - name: Pre-pull and locally re-tag the Garnet image (DCP/GHCR workaround)
      run: |
        docker pull ghcr.io/microsoft/garnet:2.1.7
        docker tag ghcr.io/microsoft/garnet:2.1.7 microsoft/garnet:2.1.7

    # Tests gate the preview deploy, same as production (deploy-blazor.yml).
    - name: Restore & Test
      run: dotnet test -c Release

    # Loopback ports on the preview host are derived from the PR number so
    # concurrent PRs never collide (Caddy is the only public entrypoint).
    - name: Compute per-PR ports and image tag
      shell: bash
      run: |
        echo "APP_PORT=$((6000 + PR_NUMBER))" >> "$GITHUB_ENV"
        echo "DB_PORT=$((15432 + PR_NUMBER))" >> "$GITHUB_ENV"
        echo "FLOCI_PORT=$((24566 + PR_NUMBER))" >> "$GITHUB_ENV"
        echo "FLOCI_AZ_PORT=$((24577 + PR_NUMBER))" >> "$GITHUB_ENV"
        echo "FLOCI_GCP_PORT=$((24588 + PR_NUMBER))" >> "$GITHUB_ENV"
        echo "FLOCI_OCI_PORT=$((24599 + PR_NUMBER))" >> "$GITHUB_ENV"
        echo "APP_IMAGE=brewhouse-pr-${PR_NUMBER}:${GITHUB_SHA::8}" >> "$GITHUB_ENV"
        echo "PREVIEW_URL=https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}" >> "$GITHUB_ENV"

    - name: Build preview image
      run: docker build -f src/BrewHouse/Dockerfile -t "${APP_IMAGE}" .

    - name: Transfer image to the preview host
      run: docker save "${APP_IMAGE}" | gzip | ssh root@${PREVIEW_HOST} "gunzip | docker load"

    - name: Install EF Core CLI
      # Same fix as deploy-blazor.yml: `dotnet tool install --global` puts the
      # binary in ~/.dotnet/tools, which isn't on this self-hosted runner's
      # PATH by default - confirmed live, identical failure here
      # ("Could not execute because the specified command or file was not
      # found... dotnet-ef does not exist").
      run: |
        dotnet tool install --global dotnet-ef
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Generate EF Core Migration Bundle
      run: dotnet ef migrations bundle --project ./src/BrewHouse/BrewHouse.csproj --self-contained -r linux-x64 -o ./efbundle/efbundle

    # Ephemeral per-PR database password: generated here, stored only in the
    # .env file on the preview host. No GitHub secret needed — the stack is
    # destroyed when the PR closes.
    - name: Stage stack files on the preview host
      shell: bash
      run: |
        DB_PASSWORD=$(openssl rand -hex 16)
        echo "DB_PASSWORD=${DB_PASSWORD}" >> "$GITHUB_ENV"
        ssh root@${PREVIEW_HOST} "mkdir -p /opt/previews/pr-${PR_NUMBER}"
        scp deploy/preview/docker-compose.pr.yml root@${PREVIEW_HOST}:/opt/previews/pr-${PR_NUMBER}/docker-compose.yml
        ssh root@${PREVIEW_HOST} "umask 077 && cat > /opt/previews/pr-${PR_NUMBER}/.env" << ENV_EOF
        PR_NUMBER=${PR_NUMBER}
        APP_IMAGE=${APP_IMAGE}
        APP_PORT=${APP_PORT}
        DB_PORT=${DB_PORT}
        DB_PASSWORD=${DB_PASSWORD}
        FLOCI_PORT=${FLOCI_PORT}
        FLOCI_AZ_PORT=${FLOCI_AZ_PORT}
        FLOCI_GCP_PORT=${FLOCI_GCP_PORT}
        FLOCI_OCI_PORT=${FLOCI_OCI_PORT}
        ENV_EOF

    # `down -v` first: confirmed live, a retried/re-synchronized run for the same PR
    # otherwise reuses the previous attempt's named Postgres volume, whose data
    # directory was already initialized with THAT run's random DB_PASSWORD (Postgres
    # only applies POSTGRES_PASSWORD on first init of an empty volume) - the new
    # random password generated above then fails auth against the stale volume
    # ("password authentication failed for user brewhouse"). `|| true` since a
    # first-ever run for this PR has no prior stack/volume to remove.
    - name: Start the preview stack
      run: |
        ssh root@${PREVIEW_HOST} "cd /opt/previews/pr-${PR_NUMBER} && docker compose --env-file .env down -v" || true
        ssh root@${PREVIEW_HOST} "cd /opt/previews/pr-${PR_NUMBER} && docker compose --env-file .env up -d --wait"

    # Migrations run before the app is announced, mirroring the production
    # pipeline (ADR 11). The bundle executes on the preview host against the
    # loopback-published Postgres port.
    - name: Execute Migration Bundle against the PR database
      shell: bash
      run: |
        scp ./efbundle/efbundle root@${PREVIEW_HOST}:/opt/previews/pr-${PR_NUMBER}/efbundle
        ssh root@${PREVIEW_HOST} "chmod +x /opt/previews/pr-${PR_NUMBER}/efbundle && /opt/previews/pr-${PR_NUMBER}/efbundle --connection 'Host=127.0.0.1;Port=${DB_PORT};Database=brewhouse_pr${PR_NUMBER};Username=brewhouse;Password=${DB_PASSWORD}'"

    # Every site below needs its own explicit `tls` block, not just the
    # Caddyfile's global acme_ca — Caddy's automatic HTTPS treats any
    # *.internal-style name as "not publicly issuable" and silently falls
    # back to its own self-signed "Caddy Local Authority" for it otherwise,
    # ignoring acme_ca entirely (same fix as ops.caddy.j2/floci.caddy.j2).
    - name: Register the Caddy site and reload
      run: |
        ssh root@${PREVIEW_HOST} "cat > /etc/caddy/pr-sites/pr-${PR_NUMBER}.caddy && systemctl reload caddy" << CADDY_EOF
        pr-${PR_NUMBER}.${PREVIEW_DOMAIN} {
        	tls {
        		ca ${STEP_CA_URL}/acme/acme/directory
        		ca_root /etc/caddy/pki/root_ca.crt
        	}
        	reverse_proxy 127.0.0.1:${APP_PORT}
        }
        pr-${PR_NUMBER}-aws.${PREVIEW_DOMAIN} {
        	tls {
        		ca ${STEP_CA_URL}/acme/acme/directory
        		ca_root /etc/caddy/pki/root_ca.crt
        	}
        	reverse_proxy 127.0.0.1:${FLOCI_PORT}
        }
        pr-${PR_NUMBER}-azure.${PREVIEW_DOMAIN} {
        	tls {
        		ca ${STEP_CA_URL}/acme/acme/directory
        		ca_root /etc/caddy/pki/root_ca.crt
        	}
        	reverse_proxy 127.0.0.1:${FLOCI_AZ_PORT}
        }
        pr-${PR_NUMBER}-gcp.${PREVIEW_DOMAIN} {
        	tls {
        		ca ${STEP_CA_URL}/acme/acme/directory
        		ca_root /etc/caddy/pki/root_ca.crt
        	}
        	reverse_proxy 127.0.0.1:${FLOCI_GCP_PORT}
        }
        pr-${PR_NUMBER}-oci.${PREVIEW_DOMAIN} {
        	tls {
        		ca ${STEP_CA_URL}/acme/acme/directory
        		ca_root /etc/caddy/pki/root_ca.crt
        	}
        	reverse_proxy 127.0.0.1:${FLOCI_OCI_PORT}
        }
        CADDY_EOF

    # First TLS handshake triggers ACME issuance from step-ca — allow time.
    - name: Smoke test through trusted HTTPS
      shell: bash
      run: |
        scp root@${PKI_HOST}:/root/.step/certs/root_ca.crt ./root_ca.crt
        for i in $(seq 1 12); do
          if curl -fsS --cacert ./root_ca.crt --resolve "pr-${PR_NUMBER}.${PREVIEW_DOMAIN}:443:${PREVIEW_HOST}" "https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}/health"; then
            exit 0
          fi
          echo "Waiting for preview to come up (attempt $i)..."
          sleep 10
        done
        echo "Preview failed the /health smoke test"
        exit 1

    - name: Comment the preview URL on the PR
      uses: actions/github-script@v7
      with:
        script: |
          const url = process.env.PREVIEW_URL;
          const body = `🚀 Preview environment deployed: ${url}\n\n` +
            `Stack: \`pr-${process.env.PR_NUMBER}\` on \`${process.env.PREVIEW_HOST}\` ` +
            `(image \`${process.env.APP_IMAGE}\`).\n` +
            `It is torn down automatically when this PR is merged or closed.`;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          });
