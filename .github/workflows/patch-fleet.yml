name: Patch Fleet

# Fleet-wide OS patching (docs/01 ADR 48/49, LAB-RUNBOOK.md §5). Manual-only,
# on purpose - unlike ansible-converge.yml (every push to main), patching
# reboots every LXC, so this never fires from a push or a schedule, only a
# human clicking Run.
#
# Web nodes are bracketed by the same web-offline/web-online composite
# actions deploy-blazor.yml uses for app version deploys - one place that
# logic lives, not a second copy reimplemented in Ansible.
#
# Order, confirmed live and corrected (docs/01 ADR 53): web goes offline
# FIRST, then everything web actually depends on (Postgres, Garnet,
# RabbitMQ, ADR 10's deep health checks) gets patched+rebooted WHILE web is
# still safely offline, THEN web itself patches+reboots, THEN web comes
# back online - last, not first, because bringing it back before its own
# dependencies are done patching would surface a real, user-visible outage
# (backend mid-reboot) on top of a normal maintenance window, not avoid one.
#
# devops (10.10.10.111) patches itself last, as its own step, because it's
# the box running this very workflow's self-hosted runner (ADR 22) - a
# reboot there kills the runner mid-job. ansible/roles/patch schedules that
# reboot ~15s delayed and detached specifically so the step below still
# gets to report success first; `continue-on-error` plus the always-run
# confirmation step after it are the belt-and-suspenders in case that
# timing is ever tight enough that it doesn't.

on:
  workflow_dispatch: {}

concurrency:
  group: patch-fleet
  cancel-in-progress: false

jobs:
  patch:
    runs-on: self-hosted
    environment: homelab
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Persistent self-hosted runner, not ephemeral - default `git
          # clean` would wipe generated state the same way
          # ansible-converge.yml/terraform-apply.yml already guard against.
          clean: false

      - name: Take both web nodes offline (maintenance page)
        uses: ./.github/actions/web-offline

      # Everything web depends on (Postgres, Garnet, RabbitMQ, plus every
      # other tier) patches+reboots FIRST, while web is already safely
      # offline - not after web is back online serving real traffic.
      - name: Patch every other managed tier (web and devops excluded)
        working-directory: ansible
        run: >
          ansible-playbook patch.yml
          -e @/opt/ansible-secrets/all.yml
          -e @/opt/ansible-secrets/dns.yml
          -e @/opt/ansible-secrets/web.yml
          --limit 'all:!devops:!web'

      - name: Patch and reboot the web tier
        working-directory: ansible
        run: >
          ansible-playbook patch.yml
          -e @/opt/ansible-secrets/all.yml
          -e @/opt/ansible-secrets/dns.yml
          -e @/opt/ansible-secrets/web.yml
          --limit web

      # if: always() is load-bearing (docs/01 ADR 49/52, confirmed live in
      # deploy-blazor.yml's own run of this same pattern): without it, a
      # failure in any step above stops the job here and the maintenance
      # page never comes back down - a real outage, not a hypothetical.
      # Safe to run unconditionally either way: web-online's own /health
      # gate will correctly report the node unhealthy (and Kemp will keep
      # it out of rotation) if something upstream genuinely didn't recover,
      # which is strictly better than leaving the site stuck offline.
      - name: Bring both web nodes back online
        if: always()
        uses: ./.github/actions/web-online

      - name: Patch the devops LXC (self) - delayed self-reboot, see role
        working-directory: ansible
        continue-on-error: true
        run: >
          ansible-playbook patch.yml
          -e @/opt/ansible-secrets/all.yml
          -e @/opt/ansible-secrets/dns.yml
          -e @/opt/ansible-secrets/web.yml
          --limit devops

      - name: Confirm the run completed
        if: always()
        run: |
          echo "Fleet patch run finished."
          echo "devops LXC (10.10.10.111) reboots ~15s after its own step reports success - the runner will be briefly unavailable for the next queued job while it comes back."
