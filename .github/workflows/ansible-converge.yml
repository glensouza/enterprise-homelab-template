name: Ansible Converge

# Runs `ansible-playbook site.yml` on every push to main - the routine,
# already-idempotent reapply that previously meant SSH-ing into the devops
# LXC by hand for `git pull && ansible-playbook site.yml`. Deliberately
# separate from terraform-apply.yml (ADR 22): that one stays plan-then-apply
# with an explicit reviewed diff, since creating/destroying LXCs/VLANs
# deserves more ceremony than reapplying config to hosts that already exist.
# Same production-environment approval gate as deploy-blazor.yml - nothing
# here runs unattended, this just replaces the manual SSH step with an
# approval click.

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'src/systemd/**'

# Only the latest push's run stays queued - see deploy-blazor.yml for the
# same tradeoff note (cancels wherever the older run is, not just while
# still waiting on approval).
concurrency:
  group: ansible-converge
  cancel-in-progress: true

jobs:
  converge:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Same reasoning as terraform-apply.yml - this is a persistent
          # self-hosted runner, not ephemeral; default `git clean` would
          # wipe ansible/credentials/ (generated passwords) on every run.
          clean: false

      - name: Ansible converge
        working-directory: ansible
        # Secrets come from absolute, checkout-independent files (ADR 36) -
        # confirmed live this session, repeatedly: whatever wipes this
        # runner's _work checkout between jobs (not `clean: false` itself -
        # something else) kept silently removing group_vars/*/secrets.yml
        # each time, breaking this run with an undefined-variable error.
        # -e @file is highest-precedence, so this works whether or not
        # secrets.yml happens to also exist inside the checkout.
        run: >
          ansible-playbook site.yml
          -e @/opt/ansible-secrets/all.yml
          -e @/opt/ansible-secrets/dns.yml
          -e @/opt/ansible-secrets/web.yml
