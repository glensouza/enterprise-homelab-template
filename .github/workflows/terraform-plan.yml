name: Terraform Plan

# ADR 22: infra changes get the same PR-review treatment as app changes.
# Runs on every PR touching terraform/, on the devops LXC's self-hosted
# runner (pve1 — outside the fleet this plan could touch). Posts the plan
# as a PR comment and uploads the exact plan file as an artifact so
# terraform-apply.yml can apply precisely what was reviewed here, never a
# freshly regenerated plan.
#
# workflow_dispatch (ADR 64) exists for exactly one case: an already-applied
# saved plan going stale (terraform-apply.yml's own Ansible step failing
# *after* terraform apply already succeeded, same real incident that
# prompted this) — getting a fresh plan_run_id shouldn't require opening a
# throwaway PR every time it happens. It is NOT a way to skip PR review for
# an actual infrastructure change: a real terraform/** diff should still go
# through a PR so a human reviews it as a diff, per ADR 22's whole point.
# Manual runs post their plan to the run's own Step Summary instead of a PR
# comment (no PR to comment on) — still reviewable, just one click further
# away; applying still requires a human to deliberately pass that run's
# plan_run_id to terraform-apply.yml, same gate either way.

on:
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      replace_target:
        description: >-
          Optional resource address to force-replace (terraform plan
          -replace=<address>), e.g. for the drop_preview_to_mgmt-style
          index-ordering recovery documented in LAB-RUNBOOK.md - leave blank
          for a normal plan. No terraform/** diff backs this, so it still
          goes out as a manually-dispatched plan (Step Summary, not a PR).
        required: false
        type: string

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write

defaults:
  run:
    working-directory: terraform

env:
  # Only variables with NO default in variables.tf. Anything with a default
  # (proxmox_node_1/2, unifi_api_url, proxmox_ssh_user, lxc_datastore, ...)
  # is deliberately left unset here — a TF_VAR_x="" from a missing repo
  # variable would override that default with an empty string, not fall
  # through to it.
  TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
  TF_VAR_proxmox_password: ${{ secrets.PROXMOX_PASSWORD }}
  TF_VAR_unifi_username: ${{ vars.UNIFI_USERNAME }}
  TF_VAR_unifi_password: ${{ secrets.UNIFI_PASSWORD }}
  TF_VAR_debian_template_id: ${{ vars.DEBIAN_TEMPLATE_ID }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_PLUGIN_CACHE_DIR: /opt/terraform-plugin-cache

jobs:
  plan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default `git clean` would also wipe ansible/credentials/ (the
          # generated step_ca/pgAdmin passwords, LAB-RUNBOOK's "generate
          # once, reuse forever" secrets) on every single run — this is a
          # persistent self-hosted runner, not an ephemeral one.
          clean: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          REPLACE_TARGET: ${{ inputs.replace_target }}
        run: |
          if [ -n "$REPLACE_TARGET" ]; then
            terraform plan -input=false -replace="$REPLACE_TARGET" -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact (applied verbatim by terraform-apply.yml)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('terraform/plan.txt', 'utf8');
            const header = `### Terraform Plan — run [\`${context.runId}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
              `To apply this **exact** plan, run **Terraform Apply** with \`plan_run_id: ${context.runId}\`.\n\n`;
            const maxBody = 65000 - header.length - 20;
            if (body.length > maxBody) {
              body = body.slice(0, maxBody) + '\n... (truncated, see the full log in the workflow run)';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${header}<details><summary>Show plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            });

      # ADR 64: workflow_dispatch has no PR to comment on - the run's own
      # Step Summary is the review surface instead. Still requires someone
      # to actually open it and read it before choosing to apply.
      - name: Write plan to the run's Step Summary
        if: github.event_name == 'workflow_dispatch'
        env:
          REPLACE_TARGET: ${{ inputs.replace_target }}
        run: |
          {
            echo "### Terraform Plan — run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "To apply this **exact** plan, run **Terraform Apply** with \`plan_run_id: ${GITHUB_RUN_ID}\`."
            echo
            echo "Manually dispatched (no PR) - review this plan carefully before applying; a real infrastructure change belongs in a PR instead (ADR 22)."
            if [ -n "$REPLACE_TARGET" ]; then
              echo
              echo "**-replace target:** \`${REPLACE_TARGET}\` - forces this resource to be destroyed and recreated (no config diff backs this)."
            fi
            echo
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
