name: Deploy .NET 10 Blazor App to LXC

on:
  push:
    branches:
      - main

# Only the latest push's run stays queued - an older one still waiting on
# approval (or, if already approved, still mid-deploy) gets cancelled the
# moment a newer push creates another run in this group. Worth knowing:
# this cancels a run wherever it is in its lifecycle, not just while it's
# still waiting for approval - if you approve one and then push again
# before it finishes, the running one is killed mid-deploy too.
concurrency:
  group: deploy-blazor
  cancel-in-progress: true

jobs:
  build-test-and-deploy:
    runs-on: self-hosted
    environment: production
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Confirmed live: Aspire's DCP fails to pull ghcr.io/microsoft/garnet
    # directly ("pull access denied ... repository does not exist") even
    # though a plain `docker pull` of the exact same reference succeeds -
    # a DCP/GHCR-specific incompatibility, not a real access problem.
    # Re-tagging under a registry-less local name sidesteps it entirely
    # (BrewHouse.AppHost/Program.cs references this local tag, not the
    # ghcr.io one, for exactly this reason). Idempotent, so safe to run
    # every time rather than depending on it having been done once by hand.
    - name: Pre-pull and locally re-tag the Garnet image (DCP/GHCR workaround)
      run: |
        docker pull ghcr.io/microsoft/garnet:2.1.7
        docker tag ghcr.io/microsoft/garnet:2.1.7 microsoft/garnet:2.1.7

    # Tests must pass before anything touches production.
    - name: Restore & Test
      run: dotnet test -c Release

    # Resolve semantic version: MAJOR.MINOR from version.txt, auto-incrementing
    # PATCH via a persistent state file on the runner (~/.brewhouse/deploy-build-state).
    # When version.txt changes (minor bump), PATCH resets to 0.
    - name: Resolve version
      shell: bash
      run: |
        MAJOR_MINOR=$(cat version.txt | tr -d '[:space:]')
        STATE_FILE="${HOME}/.brewhouse/deploy-build-state"
        mkdir -p "$(dirname "$STATE_FILE")"

        if [ -f "$STATE_FILE" ]; then
          PREV_MAJOR_MINOR=$(grep '^MAJOR_MINOR=' "$STATE_FILE" | cut -d= -f2)
          PREV_PATCH=$(grep '^PATCH=' "$STATE_FILE" | cut -d= -f2)
        else
          PREV_MAJOR_MINOR=""
          PREV_PATCH=0
        fi

        if [ "${MAJOR_MINOR}" = "${PREV_MAJOR_MINOR}" ]; then
          PATCH=$((PREV_PATCH + 1))
        else
          PATCH=0
        fi

        VERSION="${MAJOR_MINOR}.${PATCH}"

        cat > "$STATE_FILE" << STATE_EOF
        MAJOR_MINOR=${MAJOR_MINOR}
        PATCH=${PATCH}
        STATE_EOF

        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "Resolved version: ${VERSION}"

    - name: Publish App
      run: dotnet publish ./src/BrewHouse/BrewHouse.csproj -c Release -o ./publish /p:UseAppHost=false /p:Version=${{ env.VERSION }}

    - name: Install EF Core CLI
      # Confirmed live: `dotnet tool install --global` puts the binary in
      # ~/.dotnet/tools, which isn't on this self-hosted runner's PATH -
      # its own output literally warns "Tools directory ... is not
      # currently on the PATH environment variable". Every previous run of
      # this workflow died earlier (the DCP/Polly test flake) before ever
      # reaching the next step, which is why this was never caught until
      # that flake cleared. GITHUB_PATH persists across steps within a job,
      # unlike a plain `export`.
      run: |
        dotnet tool install --global dotnet-ef
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Generate EF Core Migration Bundle
      run: dotnet ef migrations bundle --project ./src/BrewHouse/BrewHouse.csproj --self-contained -r linux-x64 -o ./publish/efbundle

    # Pre-migration safety net: dump the database to the Synology NAS mount on
    # the Postgres LXC (local peer auth as the postgres OS user - no password needed).
    - name: Backup Database (pg_dump to NAS)
      run: |
        ssh root@10.10.120.110 "mkdir -p /mnt/synology/postgres-data/backups && sudo -u postgres pg_dump brewhouse_db | gzip > /mnt/synology/postgres-data/backups/brewhouse_db-${GITHUB_SHA::8}-$(date +%Y%m%d-%H%M%S).sql.gz"

    # Connection string lives in the EFBUNDLE_CONNECTION GitHub secret - never in the repo.
    - name: Execute Migration Bundle
      run: ./publish/efbundle --connection "${{ secrets.EFBUNDLE_CONNECTION }}"

    # Wolverine keeps its own envelope-storage schema (wolverine.*), separate from the
    # app's EF Core schema. Applied here, once, for the same reason ADR 11 forbids
    # Database.Migrate() on boot: two HA web nodes must never race on schema creation.
    # Idempotent (CREATE TABLE IF NOT EXISTS), so re-running a deploy is safe.
    - name: Apply Wolverine Envelope Schema
      env:
        ConnectionStrings__brewhousedb: ${{ secrets.EFBUNDLE_CONNECTION }}
        # db-apply talks to Postgres only. These two exist purely to satisfy the
        # fail-fast check in Program.cs section 1 - nothing dials them, because the
        # cache/broker clients are lazy and the web host never starts under db-apply.
        ConnectionStrings__cache: unused-by-db-apply:6379
        ConnectionStrings__messaging: amqp://unused-by-db-apply:5672
        ASPNETCORE_ENVIRONMENT: Production
      run: dotnet ./publish/BrewHouse.dll db-apply

    # Both nodes go down together for every deploy (not one-at-a-time behind
    # Kemp) - app_offline.htm (docs/01 ADR 48/49) takes each node fully
    # offline, including /health, so Kemp shows both down rather than
    # silently routing live traffic at a half-deployed node. Dropped BEFORE
    # either rsync starts. Same composite action patch-fleet.yml uses for OS
    # patching - one place this logic lives, not two copies that can drift.
    - name: Take both web nodes offline (maintenance page)
      uses: ./.github/actions/web-offline

    # Symlinked releases: deploy into releases/<sha>, flip 'current', restart.
    # Keeps the last 5 releases per node for instant rollback (see rollback.yml).
    # /health legitimately 503s while app_offline.htm is present (that's the
    # point), so the gate here is just "the process didn't crash-loop" - the
    # real health check happens once both nodes are back online below.
    - name: Deploy to Blazor LXC 01
      run: |
        RELEASE=/var/www/brewhouse/releases/${GITHUB_SHA}
        ssh root@10.10.110.101 "mkdir -p $RELEASE"
        rsync -avz --delete ./publish/ root@10.10.110.101:$RELEASE/
        ssh root@10.10.110.101 "ln -sfn $RELEASE /var/www/brewhouse/current && systemctl restart blazor-app.service && sleep 5 && systemctl is-active --quiet blazor-app.service"
        ssh root@10.10.110.101 "cd /var/www/brewhouse/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

    - name: Deploy to Blazor LXC 02
      run: |
        RELEASE=/var/www/brewhouse/releases/${GITHUB_SHA}
        ssh root@10.10.110.102 "mkdir -p $RELEASE"
        rsync -avz --delete ./publish/ root@10.10.110.102:$RELEASE/
        ssh root@10.10.110.102 "ln -sfn $RELEASE /var/www/brewhouse/current && systemctl restart blazor-app.service && sleep 5 && systemctl is-active --quiet blazor-app.service"
        ssh root@10.10.110.102 "cd /var/www/brewhouse/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

    # Only now, once both nodes are on the new release and confirmed running,
    # bring them back - and prove they're genuinely healthy, not just alive.
    - name: Bring both web nodes back online
      uses: ./.github/actions/web-online
