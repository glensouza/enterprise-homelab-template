name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Self-hosted (ADR 84), same as every other workflow in this repo. Public
# repo + `pull_request` trigger, but gitleaks only reads checked-out files
# as data - no PR-supplied code ever executes here, unlike pr-build-test.yml
# (see that file's own comment for the real mitigation: Settings -> Actions
# -> General -> "Require approval for all external contributors").
jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # full history — gitleaks scans commits, not just the working tree

    - name: Install gitleaks
      env:
        GITLEAKS_VERSION: "8.30.1"
      run: |
        curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        tar -xzf gitleaks.tar.gz gitleaks
        sudo install gitleaks /usr/local/bin/gitleaks
        rm gitleaks.tar.gz

    - name: Run gitleaks
      run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
