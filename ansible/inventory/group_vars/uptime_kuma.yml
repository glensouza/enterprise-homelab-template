---
# Uptime Kuma LXC — stub install (DEMO-AUDIT.md R7 sibling gap, roles/uptime-kuma).
nodejs_major_version: "20"
uptime_kuma_version: "2.5.3"

# Picked up by the homepage role (ADR 38) to auto-populate the dashboard.
# href is the Caddy-fronted, Authentik-gated hostname (roles/caddy-forward-
# auth, docs/01 ADR 66/71), not the raw :3001 port - matching the same
# convention preview.yml's Dozzle/RedisInsight tiles already used.
homepage_service:
  - group: Observability
    name: Uptime Kuma
    icon: uptime-kuma.png
    href: "https://kuma.{{ internal_domain }}"
    description: Fleet status page & uptime history
    ping: "{{ ansible_host }}"

# Seeded as code (docs/01 ADR 60) - keys match uptime-kuma-api's
# _build_monitor_data() kwargs exactly (camelCase where it uses camelCase).
# `type` is a MonitorType enum member name, resolved by seed_monitors.py.
uptime_kuma_monitors:
  - name: "Blazor App (via Kemp VIP)"
    type: HTTP
    # 10.10.10.199 is Kemp's WUI (management console, eth0/LAN, docs/03
    # section 0) - a real but wrong address to monitor: it answers HTTPS
    # with its own "Document is not accessible" 404 for any path the WUI
    # itself doesn't serve, which reads as "up" to a human glancing at the
    # dashboard but is not the load-balanced app at all. The actual VIP
    # (eth1/VLAN 110, docs/03 section 1) is 10.10.110.199.
    url: "https://10.10.110.199/health"
    ignoreTls: true
  - name: "PostgreSQL"
    type: PORT
    hostname: "10.10.120.110"
    port: 5432
  - name: "Garnet"
    type: PORT
    hostname: "10.10.120.111"
    port: 6379
  - name: "RabbitMQ"
    type: PORT
    hostname: "10.10.120.112"
    port: 5672
  - name: "Infisical"
    type: PORT
    hostname: "10.10.130.116"
    port: 8080
  - name: "step-ca"
    type: PORT
    hostname: "10.10.130.121"
    port: 4443
  - name: "Technitium DNS"
    type: PORT
    hostname: "10.10.130.119"
    port: 53
  - name: "PatchMon"
    type: PORT
    hostname: "10.10.130.122"
    port: 3000
  - name: "Homepage"
    type: PORT
    hostname: "10.10.130.120"
    port: 3000
  - name: "Authentik"
    type: HTTP
    # Root "/" legitimately 302s (redirect to login) whenever the monitor
    # itself isn't authenticated, which every check run always is - Kuma's
    # default accepted status codes are 200-299 only, so that 302 always
    # reads as "down" even though the service is healthy. The dedicated
    # readiness endpoint (confirmed live, docs/01 ADR 65) returns a plain
    # 200 instead.
    url: "https://authentik.{{ internal_domain }}/-/health/ready/"
    ignoreTls: true
  - name: "Grafana / Observability"
    type: PORT
    hostname: "10.10.130.118"
    port: 3000
  - name: "Portainer (preview)"
    type: HTTP
    url: "https://portainer.{{ internal_domain }}"
    ignoreTls: true
  - name: "Dozzle (preview)"
    type: HTTP
    url: "https://dozzle.{{ internal_domain }}"
    ignoreTls: true
  - name: "pgAdmin (preview)"
    type: HTTP
    url: "https://pgadmin.{{ internal_domain }}"
    ignoreTls: true
  - name: "RedisInsight (preview)"
    type: HTTP
    url: "https://redisinsight.{{ internal_domain }}"
    ignoreTls: true
