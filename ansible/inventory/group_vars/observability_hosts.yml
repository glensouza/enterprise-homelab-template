---
# Observability LXC — stub pipeline (DEMO-AUDIT.md R7, roles/observability).
prometheus_version: "2.55.1"
observability_retention: 24h

# Alertmanager email (docs/01 ADR 114). The sender/recipient address and the Gmail app
# password are NOT here: they arrive as the GitHub secrets ALERTMANAGER_SMTP_USER /
# ALERTMANAGER_SMTP_PASSWORD (environment of the converge run, docs/13).
alertmanager_smtp_smarthost: "smtp.gmail.com:587"

# prometheus-pve-exporter (docs/01 ADR 115). The read-only token comes from
# /opt/ansible-secrets/pve-exporter.yml (terraform/pve-exporter.tf). The Proxmox API is
# cluster-aware, so pve1 (the cluster master) answers for every node.
pve_exporter_version: "3.10.1"
pve_exporter_target: "10.10.10.101"

# Picked up by the homepage role (ADR 38) to auto-populate the dashboard.
homepage_service:
  - group: Observability
    name: Grafana
    icon: grafana.png
    href: "http://{{ ansible_host }}:3000"
    description: Dashboards over Loki/Tempo/Prometheus
    ping: "{{ ansible_host }}"
