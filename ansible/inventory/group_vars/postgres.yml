---
# PostgreSQL LXC (10.10.120.110). /mnt/synology/postgres-data is a
# terraform/lxc.tf mount_point bind-mount from the Proxmox host, not an
# in-guest NFS mount - unprivileged LXCs can't mount NFS themselves. The host
# (pve4) mounts 10.10.10.90:/volume1/homelab-postgres-data at
# /mnt/homelab-postgres-data via its own /etc/fstab (docs/04).

# pgBackRest PITR (docs/10 section 4). The repo lives on the NAS mount so WAL
# archives and backups survive loss of the LXC itself.
pgbackrest_stanza: brewhouse
pgbackrest_repo_path: /mnt/synology/postgres-data/pgbackrest
pgbackrest_repo_mount: /mnt/synology/postgres-data
# Debian 12 (bookworm)'s default apt repo installs PostgreSQL 15, not 16 -
# confirmed live via `psql --version` after `apt install postgresql` per
# docs/04 §2's install command, which doesn't pin a version or add the PGDG
# repo. Must match whatever actually gets installed, or postgres_data_dir/
# postgres_conf_dir below point at a directory that doesn't exist.
postgres_version: "15"
postgres_data_dir: "/var/lib/postgresql/{{ postgres_version }}/main"
postgres_conf_dir: "/etc/postgresql/{{ postgres_version }}/main"

# Remote clients allowed past pg_hba.conf (ADR 42) - scoped to exactly what
# the existing UniFi firewall policies already pass through, not a broad
# "trust the LAN" rule. VLAN110 is the app (blazor-web-03/04, runtime
# ConnectionStrings__brewhousedb); VLAN140 is the preview host (pgAdmin,
# preview_to_postgres); the /32 is the devops LXC, the only host running the
# self-hosted GitHub Actions runner that executes the EF migration bundle.
postgres_allowed_networks:
  - { cidr: "10.10.110.0/24", comment: "web LXCs (app runtime)" }
  - { cidr: "10.10.140.0/24", comment: "preview host (pgAdmin)" }
  - { cidr: "10.10.10.111/32", comment: "devops LXC (CI runner, EF migration bundle)" }
  - { cidr: "10.10.130.123/32", comment: "authentik LXC (docs/01 ADR 59) - management VLAN's own mgmt_to_any UniFi policy already permits the traffic; this is the pg_hba/application-level gate" }

# ADR 30: generated once on the Ansible controller and reused on every run -
# cached under /opt/ansible-credentials (ADR 35), outside any git checkout.
postgres_brewhouse_password: "{{ lookup('ansible.builtin.password', '/opt/ansible-credentials/postgres/brewhouse_password length=32 chars=ascii_letters,digits') }}"
