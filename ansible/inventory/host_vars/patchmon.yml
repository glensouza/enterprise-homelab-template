---
# PatchMon (ADR 33). Generated once on the Ansible controller and reused on
# every run - cached under /opt/ansible-credentials (ADR 35), outside any git checkout
# step_ca_password.
patchmon_db_password: "{{ lookup('ansible.builtin.password', '/opt/ansible-credentials/patchmon/db_password length=32 chars=ascii_letters,digits') }}"
patchmon_jwt_secret: "{{ lookup('ansible.builtin.password', '/opt/ansible-credentials/patchmon/jwt_secret length=64 chars=hexdigits') }}"
patchmon_session_secret: "{{ lookup('ansible.builtin.password', '/opt/ansible-credentials/patchmon/session_secret length=64 chars=hexdigits') }}"
patchmon_ai_encryption_key: "{{ lookup('ansible.builtin.password', '/opt/ansible-credentials/patchmon/ai_encryption_key length=64 chars=hexdigits') }}"
