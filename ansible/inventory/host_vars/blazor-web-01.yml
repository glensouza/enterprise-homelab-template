---
# Picked up by the homepage role (ADR 38) to auto-populate the dashboard.
# Direct app URL, bypassing the Kemp VIP - useful to confirm which specific
# node is serving/broken when the load-balanced entry (Application group,
# group_vars/homepage.yml) looks unhealthy.
homepage_service:
  - group: Application
    name: Blazor Web 01
    icon: dotnet.png
    href: "http://{{ ansible_host }}:5000"
    description: Direct app URL (bypasses Kemp VIP)
    ping: "{{ ansible_host }}"
