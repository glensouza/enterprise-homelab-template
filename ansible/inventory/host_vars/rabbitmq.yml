---
# RabbitMQ (ADR 07/10). Generated once on the Ansible controller and reused
# on every run - cached under /opt/ansible-credentials (ADR 35), outside any git checkout
# step_ca_password.
rabbitmq_password: "{{ lookup('ansible.builtin.password', '/opt/ansible-credentials/rabbitmq/password length=32 chars=ascii_letters,digits') }}"

# Picked up by the homepage role (ADR 38) to auto-populate the dashboard -
# href is the Caddy-fronted, Authentik-gated hostname (roles/caddy-forward-
# auth, docs/01 ADR 66/71), not the raw :15672 port.
homepage_service:
  - group: Infrastructure
    name: RabbitMQ
    icon: rabbitmq.png
    href: "https://rabbitmq.{{ internal_domain }}"
    description: Message broker management UI
    ping: "{{ ansible_host }}"
