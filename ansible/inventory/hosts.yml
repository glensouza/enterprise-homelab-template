# Static inventory. Mirrors the CLAUDE.md topology matrix and terraform/lxc.tf.
# `terraform apply` also renders terraform-hosts.yml into this directory with
# the same groups; if both are present, static entries win on conflicts.
all:
  children:
    # VLAN 110 — Blazor web nodes behind the Kemp VIP
    web:
      hosts:
        blazor-web-01:
          ansible_host: 10.10.110.101
        blazor-web-02:
          ansible_host: 10.10.110.102
    # VLAN 120 — PostgreSQL (pgvector) with pgBackRest PITR
    postgres:
      hosts:
        postgresql:
          ansible_host: 10.10.120.110
    # VLAN 130 — Technitium DNS (ADR 20)
    dns:
      hosts:
        technitium-dns:
          ansible_host: 10.10.130.119
    # VLAN 130 — step-ca internal PKI (ADR 20)
    pki:
      hosts:
        step-ca:
          ansible_host: 10.10.130.121
    # VLAN 140 — single non-prod PR preview host (ADR 19)
    preview:
      hosts:
        pr-preview:
          ansible_host: 10.10.140.120
    # VLAN 130 — Observability: Alloy/Loki/Tempo/Prometheus/Grafana stub
    # (DEMO-AUDIT.md R7, ansible/roles/observability)
    observability:
      hosts:
        observability:
          ansible_host: 10.10.130.118
    # VLAN 130 — Uptime Kuma stub (DEMO-AUDIT.md R7 sibling gap,
    # ansible/roles/uptime-kuma)
    uptime-kuma:
      hosts:
        uptime-kuma:
          ansible_host: 10.10.130.117
    # Remaining LXCs — no service roles today, but part of `all` so Cockpit,
    # internal DNS A records, and step-ca certificates cover the whole fleet
    # (ADR 21).
    infra:
      hosts:
        cloudflared:
          ansible_host: 10.10.110.5
        garnet:
          ansible_host: 10.10.120.111
        rabbitmq:
          ansible_host: 10.10.120.112
        infisical:
          ansible_host: 10.10.130.116
        patchmon:
          ansible_host: 10.10.130.122
