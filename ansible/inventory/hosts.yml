# Static inventory. Mirrors the CLAUDE.md topology matrix and terraform/lxc.tf.
# `terraform apply` also renders terraform-hosts.yml into this directory with
# the same groups; if both are present, static entries win on conflicts.
all:
  vars:
    # terraform/lxc.tf injects var.ssh_public_key (brewhouse_ansible.pub) into
    # every LXC's root user_account - this is its matching private key. Set
    # here (not relying on ~/.ssh/config) so `ansible-playbook` works from any
    # operator's machine without per-host IdentityFile entries. Confirmed
    # live: without this, ansible-playbook site.yml fails every host with
    # "Permission denied (publickey,password)" since plain ssh has no reason
    # to try this non-default-named key.
    ansible_ssh_private_key_file: ~/.ssh/brewhouse_ansible
  children:
    # VLAN 110 — Blazor web nodes behind the Kemp VIP. Renamed 2026-09-19
    # (docs/01 ADR 50): blazor-web-04 is on pve4, blazor-web-03 on pve3 -
    # matches the VMID/node convention (terraform/lxc.tf), unlike the old
    # 01-on-pve4/02-on-pve3 names.
    web:
      hosts:
        blazor-web-04:
          ansible_host: 10.10.110.101
        blazor-web-03:
          ansible_host: 10.10.110.102
    # VLAN 120 — PostgreSQL (pgvector) with pgBackRest PITR
    postgres:
      hosts:
        postgresql:
          ansible_host: 10.10.120.110
    # VLAN 130 — Technitium DNS (ADR 20)
    dns:
      hosts:
        technitium-dns:
          ansible_host: 10.10.130.119
    # VLAN 130 — step-ca internal PKI (ADR 20)
    pki:
      hosts:
        step-ca:
          ansible_host: 10.10.130.121
    # VLAN 140 — single non-prod PR preview host (ADR 19)
    preview:
      hosts:
        pr-preview:
          ansible_host: 10.10.140.120
    # VLAN 130 — Observability: Alloy/Loki/Tempo/Prometheus/Grafana stub
    # (DEMO-AUDIT.md R7, ansible/roles/observability)
    observability:
      hosts:
        observability:
          ansible_host: 10.10.130.118
    # VLAN 130 — Uptime Kuma stub (DEMO-AUDIT.md R7 sibling gap,
    # ansible/roles/uptime-kuma)
    uptime-kuma:
      hosts:
        uptime-kuma:
          ansible_host: 10.10.130.117
    # VLAN 130 — Homepage dashboard (ADR 38). Its services.yaml is generated
    # from every other host's `homepage_service` var (group_vars/host_vars),
    # not hand-maintained - see ansible/roles/homepage.
    homepage:
      hosts:
        homepage:
          ansible_host: 10.10.130.120
    # Remaining LXCs — no service roles today, but part of `all` so Cockpit,
    # internal DNS A records, and step-ca certificates cover the whole fleet
    # (ADR 21).
    infra:
      hosts:
        cloudflared:
          ansible_host: 10.10.110.5
        garnet:
          ansible_host: 10.10.120.111
        rabbitmq:
          ansible_host: 10.10.120.112
        infisical:
          ansible_host: 10.10.130.116
        patchmon:
          ansible_host: 10.10.130.122
    # pve1 — the manually-provisioned (not Terraform-managed) control box
    # (ADR 22, LAB-RUNBOOK.md's DevOps LXC section): Terraform, Ansible, and
    # the GitHub Actions self-hosted runner all live here. Only `patch.yml`
    # (docs/01 ADR 49) targets this group, and only as its last play — never
    # `site.yml`, which predates this LXC existing in inventory at all.
    devops:
      hosts:
        devops-lxc:
          ansible_host: 10.10.10.111
