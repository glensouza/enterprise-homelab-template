---
# Configuration management for the lab LXCs (docs/08).
# Run after `terraform apply`:  ansible-playbook site.yml
# Target a single tier:         ansible-playbook site.yml --limit web
#
# Infisical runs FIRST, deliberately - postgres/garnet/rabbitmq/observability
# each push their own generated connection secret into it as their last task
# (ADR 28, ansible/roles/infisical-secret), so Infisical has to already be up
# and reachable before any of those plays run, not after.
- name: Configure Infisical secrets vault (VLAN 130, ADR 12/26)
  hosts: infisical
  roles:
    - infisical

- name: Configure Blazor web nodes (VLAN 110)
  hosts: web
  roles:
    - dotnet-runtime
    - infisical-agent
    - blazor-app

- name: Configure PostgreSQL node (VLAN 120)
  hosts: postgres
  roles:
    - postgres

- name: Configure Technitium DNS (VLAN 130, ADR 20)
  hosts: dns
  roles:
    - technitium

# docs/01 ADR 100: cloudflared itself is still installed manually (LAB-
# RUNBOOK.md, docs/04 §2) - this role only manages the one thing that
# needed fixing after the fact (the installer's default systemd
# TimeoutStartSec), not a full reinstall of the app.
- name: Configure cloudflared's systemd start timeout (VLAN 110, ADR 100)
  hosts: cloudflared
  roles:
    - cloudflared

# Fleet-wide (docs/01 ADR 67): previously only pki/preview got this role,
# via their own roles: list below (now removed - this play covers them
# too). Every other host still pointed at the generic UniFi gateway, which
# has no idea about brewhouse.internal, so any hostname-based
# *.brewhouse.internal request from those hosts (Uptime Kuma's own
# hostname-based monitors; the new caddy-forward-auth role's forward_auth
# call to authentik.brewhouse.internal, ADR 66) NXDOMAINs instead of
# resolving. Runs right after the dns play so Technitium is already up.
- name: Point every host's DNS at Technitium (VLAN 130, ADR 20/67)
  hosts: all:!devops
  roles:
    - resolver

# Fleet-wide root password fallback (docs/01 ADR 87). devops excluded
# deliberately - it already has its own distinct, manually-set password
# (ADR 82), and this role would otherwise overwrite it with the shared
# fleet value on every converge.
- name: Set the fleet-wide root password
  hosts: all:!devops
  roles:
    - root-password

- name: Configure step-ca internal PKI (VLAN 130, ADR 20)
  hosts: pki
  roles:
    - step-ca

- name: Configure Garnet cache & SignalR backplane (VLAN 120, ADR 04/08/27)
  hosts: garnet
  roles:
    - dotnet-runtime
    - garnet

- name: Configure RabbitMQ message broker (VLAN 120, ADR 07/27)
  hosts: rabbitmq
  roles:
    - rabbitmq

- name: Configure PatchMon server (VLAN 130, ADR 33)
  hosts: patchmon
  roles:
    - patchmon

- name: Configure Authentik SSO (VLAN 130, ADR 59/61)
  hosts: authentik
  roles:
    - authentik

# docs/01 ADR 91 - CritterWatch (JasperFx Wolverine/Marten monitoring
# console). infisical-agent's defaults render BrewHouse's own
# /etc/brewhouse/brewhouse.env (the web play above) - overridden here to
# this host's own path/key-count, same role, second consumer.
- name: Configure CritterWatch (VLAN 130, ADR 91)
  hosts: critterwatch
  roles:
    - dotnet-runtime
    - role: infisical-agent
      vars:
        infisical_agent_env_path: /etc/critterwatch/critterwatch.env
        infisical_agent_min_keys: 2
    - critterwatch

- name: Configure the PR preview host (VLAN 140, ADR 19)
  hosts: preview
  roles:
    - docker
    - preview-host

# Stub pipeline (DEMO-AUDIT.md R7) — enough for a real trace on screen; the
# full build-out is the on-camera subject of S1-09.
- name: Configure observability (VLAN 130)
  hosts: observability_hosts
  roles:
    - observability

# Stub install (DEMO-AUDIT.md R7 sibling gap) — a real status page, no
# monitors configured yet.
- name: Configure Uptime Kuma (VLAN 130)
  hosts: uptime_kuma
  roles:
    - uptime-kuma

# Reads every other host's `homepage_service` var (host_vars/group_vars,
# ADR 38) via hostvars - those are inventory-parse-time vars, not runtime
# facts, so this play has no ordering dependency on the ones above and could
# run anywhere in this file. Kept here anyway since "list every other
# service" reads best after they've all been introduced.
- name: Configure Homepage dashboard (VLAN 130, ADR 38)
  hosts: homepage_hosts
  roles:
    - homepage

# Fleet-wide (ADR 83). No ordering dependency, same reasoning as the
# Homepage play above - homepage_service is inventory-parse-time, not a
# runtime fact - but kept after it anyway so the wording is settled before
# it lands in every host's own login banner. devops excluded, same reason
# as the Cockpit/PatchMon play below (ADR 49) - Ansible has no key to reach
# it directly.
- name: Configure per-host root login banner (VLAN all, ADR 83)
  hosts: all:!devops
  roles:
    - motd

# Runs LAST: the step-ca play above generates and fetches the per-host
# certificates the cockpit role installs, and the patchmon play above
# already has the PatchMon server (ADR 33) up before this enrolls every
# host as an agent against it (ADR 34).
#
# devops is excluded (docs/01 ADR 49): adding it to inventory made it part
# of `all` for the first time, and this play tried to SSH into it like
# every other host - confirmed live, it fails UNREACHABLE, because devops
# only holds the brewhouse_ansible private key to connect OUT to the rest
# of the fleet (ADR 22); nothing ever added that key to devops's own
# authorized_keys, since Ansible never needed to reach it before patch.yml.
# Cockpit/PatchMon coverage for devops itself stays a follow-up, not bundled
# into an unrelated fix here.
- name: Fleet-wide Cockpit and PatchMon agent enrollment (ADR 21/34)
  hosts: all:!devops
  roles:
    - cockpit
    - patchmon-agent
