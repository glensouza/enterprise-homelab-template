---
# docs/01 ADR 100: cloudflared itself has no role of its own elsewhere in
# this repo - it's installed manually via the community-scripts installer
# during LXC provisioning (LAB-RUNBOOK.md, docs/04 §2), token entered by
# hand. That installer's own systemd unit ships with TimeoutStartSec=15,
# which is too tight for this LXC's single vCPU (cloudflared opens
# several redundant QUIC connections to Cloudflare's edge before it
# signals ready to systemd, Type=notify) - confirmed live: the service
# crash-looped (restart counter in the dozens, journalctl showing
# "Failed with result 'timeout'" on a ~5s cadence) until this override
# was applied, at which point it started cleanly and the public tunnel
# (homelab.smartsoftwarecoffee.com) came back to a real 200. A systemd
# drop-in, not editing the vendored unit file directly, so a future
# reinstall via the same community script doesn't silently re-clobber it.
# Installs and enrolls cloudflared from Cloudflare's own apt repo (ADR 112; previously a
# manual community-script step, which a rebuild silently skipped). The tunnel token comes
# from the GitHub secret CLOUDFLARED_TUNNEL_TOKEN (env on the runner); without it the host
# is skipped rather than failing the converge.
- name: Check whether cloudflared is installed and enrolled
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared.service
  register: cloudflared_unit

- name: Skip cloudflared - no tunnel token supplied (set the CLOUDFLARED_TUNNEL_TOKEN GitHub secret)
  ansible.builtin.meta: end_host
  when: not cloudflared_unit.stat.exists and cloudflared_tunnel_token | length == 0

- name: Add Cloudflare's apt signing key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"
  when: not cloudflared_unit.stat.exists

- name: Add the cloudflared apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
    filename: cloudflared
    state: present
  when: not cloudflared_unit.stat.exists

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    update_cache: true
    state: present
  when: not cloudflared_unit.stat.exists

- name: Enroll cloudflared with the tunnel (creates cloudflared.service)
  ansible.builtin.command: "cloudflared service install {{ cloudflared_tunnel_token }}"
  when: not cloudflared_unit.stat.exists
  no_log: true

- name: Ensure the cloudflared.service systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/cloudflared.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Raise cloudflared.service's start timeout (single-vCPU LXC is too slow for the installer's default 15s)
  ansible.builtin.copy:
    dest: /etc/systemd/system/cloudflared.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      TimeoutStartSec=90
  register: cloudflared_timeout_override

- name: Reload systemd and restart cloudflared if the override changed
  ansible.builtin.systemd:
    name: cloudflared
    daemon_reload: true
    state: restarted
  when: cloudflared_timeout_override.changed
