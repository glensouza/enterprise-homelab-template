---
- name: systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: restart loki
  ansible.builtin.service:
    name: loki
    state: restarted

- name: restart tempo
  ansible.builtin.service:
    name: tempo
    state: restarted

- name: restart alloy
  ansible.builtin.service:
    name: alloy
    state: restarted

- name: restart grafana-server
  ansible.builtin.service:
    name: grafana-server
    state: restarted
