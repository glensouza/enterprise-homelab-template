---
# STUB (DEMO-AUDIT.md R7, docs/07-observability.md section 3). Gets a real
# OTLP -> Alloy -> Loki/Tempo/Prometheus -> Grafana pipeline running on the
# observability LXC so a trace actually appears on screen. Dashboards-as-code,
# alerting, retention tuning, and the ADR entry are deliberately left out —
# that build-out is the on-camera subject of S1-09 and shouldn't be
# pre-empted here.

# --- Repair first (docs/01 ADR 109) -------------------------------------------
# A previous converge left /etc/default/grafana-server with unquoted
# `GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email` lines (duplicated: ADR
# 102 changed the blockinfile marker, so each run appended another copy). The
# grafana package's postinst SOURCES that file as shell, so any apt run that
# touches the half-configured package fails - including every apt task below.
# So this repair must run BEFORE the first apt call, not after it. Grafana's
# settings now live in a systemd EnvironmentFile drop-in (see the OIDC section).
- name: Check for the packaged Grafana defaults file
  ansible.builtin.stat:
    path: /etc/default/grafana-server
  register: observability_grafana_defaults

- name: Remove the old Authentik OIDC blocks from the packaged defaults file
  ansible.builtin.blockinfile:
    path: /etc/default/grafana-server
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Authentik OIDC (docs/01 ADR {{ item }})"
    state: absent
  loop: ["72", "72/102"]
  when: observability_grafana_defaults.stat.exists

- name: Remove stray GF_* lines left in the packaged defaults file
  ansible.builtin.lineinfile:
    path: /etc/default/grafana-server
    regexp: '^GF_'
    state: absent
  when: observability_grafana_defaults.stat.exists

# A prior failed dist-upgrade leaves the package half-configured ("iF"); now
# that the sourced file is clean, finish it. No-op when nothing is pending.
- name: Finish configuring any half-configured packages
  ansible.builtin.command: dpkg --configure -a
  register: observability_dpkg_configure
  changed_when: "'Setting up' in observability_dpkg_configure.stdout"

- name: Install apt prerequisites
  ansible.builtin.apt:
    name: [apt-transport-https, gnupg, curl]
    update_cache: true
    state: present

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Grafana apt GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present

- name: Install Grafana, Loki, Tempo, Alloy
  ansible.builtin.apt:
    name: [grafana, loki, tempo, alloy]
    update_cache: true
    state: present

# --- Prometheus (no official apt package — official tarball release) --------
- name: Create prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download and unpack Prometheus
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"

- name: Symlink prometheus/promtool binaries onto PATH
  ansible.builtin.file:
    src: "/opt/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [prometheus, promtool]

- name: Configure Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Install Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: [systemd daemon-reload, restart prometheus]

# --- Loki / Tempo / Alloy / Grafana configs ----------------------------------
# Confirmed live: the loki/tempo apt packages create the loki/tempo system
# users but give them primary group nogroup (65534), not a same-named group
# - there is no loki/tempo group to chgrp to.
- name: Create Loki data directory
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    group: nogroup
    mode: "0755"

- name: Configure Loki
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: /etc/loki/config.yml
    mode: "0644"
  notify: restart loki

- name: Create Tempo data directory
  ansible.builtin.file:
    path: /var/lib/tempo
    state: directory
    owner: tempo
    group: nogroup
    mode: "0755"

- name: Configure Tempo
  ansible.builtin.template:
    src: tempo.yml.j2
    dest: /etc/tempo/config.yml
    mode: "0644"
  notify: restart tempo

- name: Configure Alloy
  # Public-facing OTLP endpoint (docs/07): both Blazor nodes point
  # OTEL_EXPORTER_OTLP_ENDPOINT here.
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: "0644"
  notify: restart alloy

- name: Provision Grafana datasources (Prometheus/Loki/Tempo)
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/observability.yml
    mode: "0644"
  notify: restart grafana-server

# --- Alertmanager + alert rules + node dashboard (docs/01 ADR 114) -------------
# SMTP settings come from the controller's environment (GitHub secrets passed by
# the converge workflows) so a destroy-and-recreate needs no hand-work. The
# password is also pushed to Infisical /admin (vault copy for humans), and read
# back from there when a converge runs without the env var (manual runs).
- name: Resolve Alertmanager SMTP settings from the environment
  ansible.builtin.set_fact:
    alertmanager_smtp_user: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_SMTP_USER') }}"
    alertmanager_smtp_password: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_SMTP_PASSWORD') }}"
  no_log: true

- name: Fall back to the vault copy of the SMTP password
  when: alertmanager_smtp_password == "" and infisical_project_id is defined
  no_log: true
  block:
    - name: "Infisical: authenticate as the provisioning identity"
      ansible.builtin.uri:
        url: "http://{{ hostvars['infisical'].ansible_host }}:8080/api/v1/auth/universal-auth/login"
        method: POST
        body_format: json
        body:
          clientId: "{{ infisical_provision_client_id }}"
          clientSecret: "{{ infisical_provision_client_secret }}"
      register: observability_infisical_auth

    - name: "Infisical: read ALERTMANAGER_SMTP_PASSWORD from /admin"
      ansible.builtin.uri:
        url: "http://{{ hostvars['infisical'].ansible_host }}:8080/api/v3/secrets/raw/ALERTMANAGER_SMTP_PASSWORD?workspaceId={{ infisical_project_id }}&environment={{ infisical_environment }}&secretPath=/admin"
        headers:
          Authorization: "Bearer {{ observability_infisical_auth.json.accessToken }}"
        status_code: [200, 404]
      register: observability_infisical_smtp

    - name: Use the vault copy
      ansible.builtin.set_fact:
        alertmanager_smtp_password: "{{ observability_infisical_smtp.json.secret.secretValue | default('') }}"

- name: Email alerts are enabled only when both SMTP values are present
  ansible.builtin.set_fact:
    alertmanager_email_enabled: "{{ alertmanager_smtp_user != '' and alertmanager_smtp_password != '' }}"
    alertmanager_email_to: "{{ alertmanager_smtp_user }}"

- name: Warn when alerts have nowhere to go
  ansible.builtin.debug:
    msg: "ALERTMANAGER_SMTP_USER / ALERTMANAGER_SMTP_PASSWORD not set - Alertmanager gets a blackhole receiver; no alert emails will be sent."
  when: not alertmanager_email_enabled

- name: Push ALERTMANAGER_SMTP_PASSWORD to Infisical (vault-only /admin)
  ansible.builtin.include_role:
    name: infisical-secret
  vars:
    infisical_secret_name: ALERTMANAGER_SMTP_PASSWORD
    infisical_secret_target: admin
    infisical_secret_value: "{{ alertmanager_smtp_password }}"
  when: infisical_project_id is defined and alertmanager_email_enabled

- name: Install Alertmanager
  ansible.builtin.apt:
    name: prometheus-alertmanager
    state: present

# Single instance: no gossip cluster, so :9094 stays closed.
- name: Configure Alertmanager flags
  ansible.builtin.copy:
    dest: /etc/default/prometheus-alertmanager
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/observability) - docs/01 ADR 114.
      ARGS="--cluster.listen-address="
  notify: restart prometheus-alertmanager

- name: Store the SMTP password for Alertmanager (root:prometheus 0640)
  ansible.builtin.copy:
    dest: /etc/prometheus/alertmanager-smtp-password
    content: "{{ alertmanager_smtp_password }}"
    owner: root
    group: prometheus
    mode: "0640"
  when: alertmanager_email_enabled
  no_log: true
  notify: restart prometheus-alertmanager

- name: Configure Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/prometheus/alertmanager.yml
    owner: root
    group: prometheus
    mode: "0640"
  notify: restart prometheus-alertmanager

- name: Create the Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"

# Copied verbatim (not templated): the rules contain Prometheus' own {{ }} annotations.
- name: Install alert rules
  ansible.builtin.copy:
    src: alert-rules.yml
    dest: /etc/prometheus/rules/infrastructure.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    validate: /usr/local/bin/promtool check rules %s
  notify: restart prometheus

- name: Create the Grafana dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Provision the Grafana dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/homelab.yml
    mode: "0644"
  notify: restart grafana-server

# grafana.com dashboard 1860 "Node Exporter Full", pinned to revision 42 and
# checksummed. It selects its datasource through a template variable, so no
# datasource substitution is needed.
- name: Download the Node Exporter Full dashboard
  ansible.builtin.get_url:
    url: https://grafana.com/api/dashboards/1860/revisions/42/download
    dest: /var/lib/grafana/dashboards/node-exporter-full.json
    checksum: "sha256:a4d827eb1819044bba2d6d257347175f6811910f2583fadeaf7e123c4df2125e"
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana-server

# grafana.com dashboard 10347 "Proxmox via Prometheus", revision 5, sha256-pinned. It
# hard-codes a ${DS_PROMETHEUS} datasource placeholder (an import-time input), so it is
# fetched to a staging path and written out with the provisioned datasource uid.
- name: Create the dashboard staging directory
  ansible.builtin.file:
    path: /usr/local/share/grafana-dashboards
    state: directory
    mode: "0755"
  when: pve_exporter_token_secret is defined

- name: Download the Proxmox via Prometheus dashboard
  ansible.builtin.get_url:
    url: https://grafana.com/api/dashboards/10347/revisions/5/download
    dest: /usr/local/share/grafana-dashboards/proxmox-via-prometheus.json
    checksum: "sha256:ac7b52531baf0fd6563b8419742d80b738439ad5db6819aa2cbb7b11c6858eff"
    mode: "0644"
  when: pve_exporter_token_secret is defined

- name: Read the staged Proxmox dashboard
  ansible.builtin.slurp:
    src: /usr/local/share/grafana-dashboards/proxmox-via-prometheus.json
  register: observability_pve_dashboard
  when: pve_exporter_token_secret is defined

- name: Provision the Proxmox dashboard with the Prometheus datasource uid
  ansible.builtin.copy:
    dest: /var/lib/grafana/dashboards/proxmox-via-prometheus.json
    content: "{{ observability_pve_dashboard.content | b64decode | replace('${DS_PROMETHEUS}', 'prometheus') }}"
    owner: grafana
    group: grafana
    mode: "0644"
  when: pve_exporter_token_secret is defined
  notify: restart grafana-server

- name: Flush handlers so every service starts with its final config
  ansible.builtin.meta: flush_handlers

- name: Enable and start the observability stack
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - prometheus
    - prometheus-alertmanager
    - loki
    - tempo
    - alloy
    - grafana-server

- name: Push OTEL_EXPORTER_OTLP_ENDPOINT to Infisical
  ansible.builtin.include_role:
    name: infisical-secret
  vars:
    infisical_secret_name: OTEL_EXPORTER_OTLP_ENDPOINT
    infisical_secret_target: brewhouse
    infisical_secret_value: "http://{{ ansible_host }}:4318"
  when: infisical_project_id is defined

# docs/01 ADR 99: without this, Program.cs's UseOtlpExporter() falls back to
# the OTel .NET SDK's own default protocol - gRPC - and tries to speak it
# against :4318, which alloy.config's otelcol.receiver.otlp only serves as
# plain HTTP/1.1 (its separate grpc block is :4317, never referenced by
# OTEL_EXPORTER_OTLP_ENDPOINT above). gRPC needs HTTP/2; the mismatch fails
# at the transport/protocol-negotiation level, which OTLP span export
# swallows silently by design (fire-and-forget, matching ADR 96's own
# framing of this same failure class) - the app never surfaces an error,
# a trace just never arrives. Confirmed live: a plain HTTP/1.1 curl POST to
# :4318/v1/traces succeeded (200) once ADR 96's firewall fix landed, but a
# real bid placed through the running app still produced nothing in Tempo -
# proving connectivity alone wasn't the whole gap.
- name: Push OTEL_EXPORTER_OTLP_PROTOCOL to Infisical
  ansible.builtin.include_role:
    name: infisical-secret
  vars:
    infisical_secret_name: OTEL_EXPORTER_OTLP_PROTOCOL
    infisical_secret_target: brewhouse
    infisical_secret_value: "http/protobuf"
  when: infisical_project_id is defined

# --- Tier-1 native OIDC via Authentik (docs/01 ADR 72) -----------------------
# Client ID/secret are generated by Authentik itself, not Ansible - same
# externally-generated-credential pattern as technitium_api_token (ADR 20):
# supplied via /opt/ansible-secrets/all.yml, skipped gracefully until present.
# Grafana's Go HTTP client verifies TLS on its own code-for-token exchange
# against Authentik and, unlike Caddy-fronted apps, has nothing else trusting
# step-ca on its behalf - same gap hit and fixed for RabbitMQ/pgAdmin/Proxmox
# in ADR 73, missed here because ADR 72 (this app) landed first (docs/01 ADR 75).
- name: Install the step-ca root certificate into the system trust store
  ansible.builtin.copy:
    src: "/opt/ansible-fetched/step-ca/root_ca.crt"
    dest: /usr/local/share/ca-certificates/step-ca-root.crt
    mode: "0644"
  register: observability_step_ca_cert
  when: grafana_oidc_client_id is defined

- name: Update the system CA trust store
  ansible.builtin.command: update-ca-certificates
  when: grafana_oidc_client_id is defined and observability_step_ca_cert.changed

# --- Grafana OIDC via a systemd EnvironmentFile drop-in (docs/01 ADR 109) ----
# This used to be a blockinfile in /etc/default/grafana-server. That file is
# SOURCED AS SHELL by the grafana package's postinst, so the unquoted
# `GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email` ran `profile` as a
# command (exit 127), left grafana half-configured, and failed every
# `apt dist-upgrade` (Patch Fleet, 2026-10-06). ADR 102 also changed the
# block's marker text, so the old block was never replaced - each converge
# appended a second copy. systemd's EnvironmentFile has no such parsing
# problem, and the packaged defaults file is left alone (it's a dpkg conffile).
# (The one-time repair of the old blocks lives at the very top of this role.)
- name: Configure Grafana's generic OAuth login against Authentik
  ansible.builtin.copy:
    dest: /etc/grafana/oauth.env
    owner: root
    group: grafana
    mode: "0640"
    content: |
      # Managed by Ansible (roles/observability) - docs/01 ADR 72/102/109.
      # Read by systemd (EnvironmentFile=), never sourced by a shell.
      GF_SERVER_ROOT_URL=http://{{ ansible_host }}:3000/
      GF_AUTH_GENERIC_OAUTH_ENABLED=true
      GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID={{ grafana_oidc_client_id }}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET={{ grafana_oidc_client_secret }}
      GF_AUTH_GENERIC_OAUTH_SCOPES="openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://authentik.{{ internal_domain }}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://authentik.{{ internal_domain }}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL=https://authentik.{{ internal_domain }}/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=https://authentik.{{ internal_domain }}/application/o/grafana/end-session/
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      # docs/01 ADR 102: with no role_attribute_path configured (no group
      # claim mapping set up in Authentik for this), Grafana re-syncs every
      # OAuth login's org role from this default - not just on first
      # sign-up - so the Authentik-provisioned user was stuck on Viewer
      # (Grafana's own hardcoded fallback) forever, Explore included
      # (requires Editor+). Editor, not Admin: enough for Explore/dashboards
      # without also granting server-wide user/org administration to
      # whichever Authentik account happens to sign in.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE=Editor
  register: observability_grafana_oauth_env
  notify: restart grafana-server
  when: grafana_oidc_client_id is defined and grafana_oidc_client_secret is defined
  no_log: true

- name: Create the grafana-server systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Load the OAuth env file into grafana-server
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/oauth.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/observability) - docs/01 ADR 109.
      [Service]
      EnvironmentFile=-/etc/grafana/oauth.env
  register: observability_grafana_dropin
  notify: restart grafana-server

- name: Reload systemd if the grafana-server drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: observability_grafana_dropin.changed
