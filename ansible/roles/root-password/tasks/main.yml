---
# Fleet-wide root password (docs/01 ADR 87). Every Terraform-managed LXC is
# otherwise SSH-key-only - terraform/lxc.tf's `user_account` block installs
# only `keys`, never a password, and that same block sits under
# `lifecycle.ignore_changes` (rotated out-of-band, same as the keys
# themselves), so a password added there wouldn't even reach an
# already-existing LXC. Setting it here instead - fleet-wide, on every
# converge, the same way every other guest-OS-level secret in this repo
# flows (technitium_api_token, uptime_kuma_username/password, ...) -
# sidesteps that entirely and covers hosts that already exist today, not
# just ones created after this role landed.
#
# Gives every LXC an interactive-console fallback (Proxmox noVNC, a getty
# prompt) that doesn't depend on the brewhouse_ansible key or SSH itself
# ever being reachable - the same reason devops's own root password exists
# (LAB-RUNBOOK.md DevOps LXC section, ADR 82), just extended fleet-wide
# with its own distinct secret rather than reusing devops's - devops keeps
# its own bootstrap-only credential untouched (this role is never applied
# to it, see site.yml), so the two blast radii stay separate.
#
# Skips gracefully (same idiom as every other optional secret in this repo)
# until lxc_root_password is supplied in /opt/ansible-secrets/all.yml.
# Confirmed live: the devops LXC (this role's `delegate_to: localhost`
# target - it IS the Ansible controller) has no pip3 at all out of the box -
# `ansible.builtin.pip` below failed fleet-wide with "Unable to find any of
# pip3 to use. pip needs to be installed." the first time this role actually
# ran in CI, breaking the whole converge (NO MORE HOSTS LEFT). Same class of
# gap as ADR 60's "plain python3-venv isn't sufficient" fix in
# roles/uptime-kuma - the generic package name a doc/example assumes exists
# isn't actually preinstalled on this fleet's minimal Debian images.
- name: Ensure pip3 is available on the controller (needed for the passlib install below)
  ansible.builtin.apt:
    name: python3-pip
    state: present
    update_cache: true
  delegate_to: localhost
  run_once: true
  when: lxc_root_password is defined

- name: Ensure passlib is available on the controller (needed for password_hash())
  ansible.builtin.pip:
    name: passlib
    state: present
    extra_args: --break-system-packages
  delegate_to: localhost
  run_once: true
  when: lxc_root_password is defined

- name: Set the fleet root password
  ansible.builtin.user:
    name: root
    password: "{{ lxc_root_password | password_hash('sha512') }}"
    update_password: always
  no_log: true
  when: lxc_root_password is defined
