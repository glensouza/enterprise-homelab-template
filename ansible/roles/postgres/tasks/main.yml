---
# PostgreSQL LXC: install PostgreSQL itself + create the brewhouse
# role/database (ADR 30 - was a manual shell block run from the devops LXC,
# LAB-RUNBOOK.md step 1.2; same treatment this session already gave
# garnet/rabbitmq/infisical), then pgBackRest PITR (docs/10 section 4) +
# pg_dump prune timer (docs/04 section 3).

# --- Install PostgreSQL + create the brewhouse role/database -----------------
- name: Install PostgreSQL
  ansible.builtin.apt:
    name: [postgresql, postgresql-contrib]
    state: present
    update_cache: true

- name: Enable and start PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

# Confirmed live: the Debian package default (listen_addresses=localhost,
# pg_hba.conf only allowing 127.0.0.1/::1) means nothing off-box can ever
# reach Postgres, even though this role hands out a connection string using
# the LXC's real LAN IP (EFBUNDLE_CONNECTION below, and
# ConnectionStrings__brewhousedb for the running app) — this was masked for
# months by earlier CI failures (DCP/Polly flake, then dotnet-ef PATH) that
# died before ever reaching a real DB connection. The relevant UniFi
# firewall policies (web_to_postgres, preview_to_postgres) already exist and
# pass traffic through fine — this is purely a Postgres-side bind/auth gap.
- name: Allow PostgreSQL to listen on all interfaces
  ansible.builtin.template:
    src: listen-addresses.conf.j2
    dest: "{{ postgres_conf_dir }}/conf.d/listen-addresses.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Allow remote scram-sha-256 connections from the app/CI/preview networks
  ansible.builtin.blockinfile:
    path: "{{ postgres_conf_dir }}/pg_hba.conf"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - remote client access"
    block: |
      {% for net in postgres_allowed_networks %}
      host    all             all             {{ net.cidr }}            scram-sha-256
      {% endfor %}
  notify: restart postgresql

- name: Flush handlers so PostgreSQL accepts remote connections before role/DB setup below
  ansible.builtin.meta: flush_handlers

- name: Create the brewhouse database role
  ansible.builtin.command: >
    su postgres -c "psql -c \"CREATE ROLE brewhouse WITH LOGIN PASSWORD '{{ postgres_brewhouse_password }}';\""
  register: create_brewhouse_role
  failed_when: create_brewhouse_role.rc != 0 and 'already exists' not in create_brewhouse_role.stderr
  changed_when: create_brewhouse_role.rc == 0
  no_log: true

# Always reconcile the live password to the cached lookup value, not just on
# first create - confirmed live this matters: this exact database already
# existed from a manual bootstrap earlier (before this role existed), with a
# password the lookup above knows nothing about. Without this, CREATE ROLE
# above would just skip ("already exists") and the value pushed to GitHub/
# Infisical below would silently be wrong - a fresh random string that
# doesn't match what's actually live. ALTER ROLE has no no-op detection, so
# this always reports changed; harmless; it's setting Postgres to a password
# it may already have.
- name: Reconcile the brewhouse role's password to the cached value
  ansible.builtin.command: >
    su postgres -c "psql -c \"ALTER ROLE brewhouse WITH PASSWORD '{{ postgres_brewhouse_password }}';\""
  changed_when: true
  no_log: true

- name: Create the brewhouse database
  ansible.builtin.command: >
    su postgres -c "psql -c \"CREATE DATABASE brewhouse_db OWNER brewhouse;\""
  register: create_brewhouse_db
  failed_when: create_brewhouse_db.rc != 0 and 'already exists' not in create_brewhouse_db.stderr
  changed_when: create_brewhouse_db.rc == 0

# gh is authenticated on the devops LXC (LAB-RUNBOOK.md section 0), not this
# LXC - delegate so the command actually runs where `gh auth login` happened.
- name: Push EFBUNDLE_CONNECTION to GitHub (consumed by the migration bundle in CI)
  ansible.builtin.command: >
    gh secret set EFBUNDLE_CONNECTION --repo glensouza/enterprise-homelab-template
    --body "Host={{ ansible_host }};Port=5432;Database=brewhouse_db;Username=brewhouse;Password={{ postgres_brewhouse_password }}"
  delegate_to: localhost
  changed_when: true
  no_log: true

- name: Push ConnectionStrings__brewhousedb to Infisical (consumed by the running app)
  ansible.builtin.include_role:
    name: infisical-secret
  vars:
    infisical_secret_name: ConnectionStrings__brewhousedb
    infisical_secret_target: brewhouse
    infisical_secret_value: "Host={{ ansible_host }};Port=5432;Database=brewhouse_db;Username=brewhouse;Password={{ postgres_brewhouse_password }}"
  when: infisical_project_id is defined

# --- authentik role/database (docs/01 ADR 59) ---------------------------------
# Same pattern as brewhouse above - Authentik reuses this shared Postgres LXC
# rather than getting its own, matching this repo's general "don't stand up a
# redundant per-app datastore when a shared one already exists" convention.
- name: Create the authentik database role
  ansible.builtin.command: >
    su postgres -c "psql -c \"CREATE ROLE authentik WITH LOGIN PASSWORD '{{ hostvars['authentik'].authentik_db_password }}';\""
  register: create_authentik_role
  failed_when: create_authentik_role.rc != 0 and 'already exists' not in create_authentik_role.stderr
  changed_when: create_authentik_role.rc == 0
  no_log: true

- name: Reconcile the authentik role's password to the cached value
  ansible.builtin.command: >
    su postgres -c "psql -c \"ALTER ROLE authentik WITH PASSWORD '{{ hostvars['authentik'].authentik_db_password }}';\""
  changed_when: true
  no_log: true

- name: Create the authentik database
  # Confirmed live: this whole cluster's databases (postgres, brewhouse_db,
  # template0/1) are SQL_ASCII/C - this LXC's underlying locale was never
  # configured for UTF-8 when Postgres was first initialized, so every
  # CREATE DATABASE without an explicit ENCODING inherits that. Harmless for
  # brewhouse_db so far (Npgsql apparently doesn't hit the same pitfall),
  # but psycopg3 (Authentik's driver) defensively returns bytes instead of
  # str for SQL_ASCII connections, which broke its own version-check code
  # with "TypeError: cannot use a string pattern on a bytes-like object".
  # UTF8 requires basing off template0, not the (also SQL_ASCII) template1 -
  # LC_COLLATE/LC_CTYPE stay "C" (not changing collation behavior, only the
  # encoding). Deliberately scoped to just this one database - fixing the
  # cluster-wide SQL_ASCII default would mean touching brewhouse_db's real
  # homelab data, a separate, much bigger decision (docs/01 ADR 65).
  ansible.builtin.command: >
    su postgres -c "psql -c \"CREATE DATABASE authentik OWNER authentik ENCODING UTF8 LC_COLLATE \\\"C\\\" LC_CTYPE \\\"C\\\" TEMPLATE template0;\""
  register: create_authentik_db
  failed_when: create_authentik_db.rc != 0 and 'already exists' not in create_authentik_db.stderr
  changed_when: create_authentik_db.rc == 0

# --- critterwatch role/database (docs/01 ADR 91) -------------------------------
# Same pattern as brewhouse/authentik above. Explicit UTF8 override, same as
# authentik - confirmed live this was wrong the first time (plain
# encoding-inheriting CREATE DATABASE, reasoning that brewhouse_db's own
# Npgsql usage doesn't hit the SQL_ASCII pitfall authentik's psycopg3 does):
# CritterWatch's console crash-looped on startup with Marten's own
# "0A000: conversion between UTF8 and SQL_ASCII is not supported" writing a
# ServiceUpdates batch - Marten's document/event JSON storage apparently
# exercises Unicode paths plain Npgsql CRUD (brewhouse_db's own workload)
# never does. Narrower lesson than ADR 65's: not "Npgsql is fine, only
# psycopg3 isn't" - it's driver-and-workload-dependent, so default to UTF8
# explicitly for any new database going forward rather than assuming inherit
# is safe.
- name: Create the critterwatch database role
  ansible.builtin.command: >
    su postgres -c "psql -c \"CREATE ROLE critterwatch WITH LOGIN PASSWORD '{{ hostvars['critterwatch'].critterwatch_db_password }}';\""
  register: create_critterwatch_role
  failed_when: create_critterwatch_role.rc != 0 and 'already exists' not in create_critterwatch_role.stderr
  changed_when: create_critterwatch_role.rc == 0
  no_log: true

- name: Reconcile the critterwatch role's password to the cached value
  ansible.builtin.command: >
    su postgres -c "psql -c \"ALTER ROLE critterwatch WITH PASSWORD '{{ hostvars['critterwatch'].critterwatch_db_password }}';\""
  changed_when: true
  no_log: true

- name: Create the critterwatch database
  ansible.builtin.command: >
    su postgres -c "psql -c \"CREATE DATABASE critterwatch OWNER critterwatch ENCODING UTF8 LC_COLLATE \\\"C\\\" LC_CTYPE \\\"C\\\" TEMPLATE template0;\""
  register: create_critterwatch_db
  failed_when: create_critterwatch_db.rc != 0 and 'already exists' not in create_critterwatch_db.stderr
  changed_when: create_critterwatch_db.rc == 0

- name: Push ConnectionStrings__critterwatch to Infisical (consumed by the running console)
  ansible.builtin.include_role:
    name: infisical-secret
  vars:
    infisical_secret_name: ConnectionStrings__critterwatch
    infisical_secret_target: critterwatch
    infisical_secret_value: "Host={{ ansible_host }};Port=5432;Database=critterwatch;Username=critterwatch;Password={{ hostvars['critterwatch'].critterwatch_db_password }}"
  when: infisical_project_id is defined

# --- pgBackRest ---------------------------------------------------------------
- name: Install pgBackRest
  ansible.builtin.apt:
    name: [pgbackrest, jq]
    update_cache: true
    state: present

# RED-RULE guardrail: the repo lives on the NAS mount; never write backups to
# the (empty) local directory if the mount is down.
- name: Verify the NAS mount is up before touching the backup repo
  ansible.builtin.command: "mountpoint -q {{ pgbackrest_repo_mount }}"
  changed_when: false
  failed_when: false
  register: nas_mount_check

- name: Fail if the NAS mount is down
  ansible.builtin.fail:
    msg: "{{ pgbackrest_repo_mount }} is not a mountpoint — NAS mount is down. Fix the mount (nfs-mounts role) before configuring pgBackRest."
  when: nas_mount_check.rc != 0

- name: Create pgBackRest local directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  loop:
    - /etc/pgbackrest
    - /var/spool/pgbackrest
    - /var/log/pgbackrest

- name: Create pgBackRest repo directory on the NAS mount
  ansible.builtin.file:
    path: "{{ pgbackrest_repo_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Configure pgBackRest
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart postgresql

- name: Enable WAL archiving in PostgreSQL
  ansible.builtin.template:
    src: pgbackrest-archive.conf.j2
    dest: "{{ postgres_conf_dir }}/conf.d/pgbackrest-archive.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Flush handlers so PostgreSQL picks up archive_command
  ansible.builtin.meta: flush_handlers

- name: Create the pgBackRest stanza (idempotent)
  ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} stanza-create"
  become: true
  become_user: postgres
  register: stanza_create
  changed_when: "'stanza-create command end: completed successfully' in stanza_create.stderr"
  # rc 28 = the NAS repo already holds a previous (destroyed) database's
  # history; handled by the stanza-upgrade task below, never by deleting it.
  failed_when: stanza_create.rc not in [0, 28]

# A rebuilt cluster has a new system-id but the repo on the NAS survives the
# rebuild: adopt it as a new db-id and keep the old backups beside it.
- name: Adopt the existing pgBackRest repo for the rebuilt cluster (stanza-upgrade)
  ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} stanza-upgrade"
  become: true
  become_user: postgres
  when: stanza_create.rc == 28
  changed_when: true

- name: Verify WAL archiving is flowing into the repo
  ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} check"
  become: true
  become_user: postgres
  register: pgbackrest_check
  changed_when: false

# A fresh cluster has no backup until the first timer (02:30); the backup-age alert
# (ADR 114) would fire on every rebuild. Take the first full backup now. Counted per
# db-id: after stanza-upgrade (ADR 113) the repo also holds the old cluster's backups.
- name: Take the first full backup when the current cluster has none
  ansible.builtin.shell: |
    set -o pipefail
    n=$(pgbackrest --stanza={{ pgbackrest_stanza }} --output=json info \
      | jq '(.[0].db | map(.id) | max) as $c | [.[0].backup[]? | select(.database.id == $c)] | length')
    if [ "$n" = "0" ]; then
      pgbackrest --stanza={{ pgbackrest_stanza }} --type=full backup && echo TOOK_FIRST_BACKUP
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: postgres
  register: pgbackrest_first_backup
  changed_when: "'TOOK_FIRST_BACKUP' in pgbackrest_first_backup.stdout"

- name: Install pgBackRest backup timers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pgbackrest-diff.service
    - pgbackrest-diff.timer
    - pgbackrest-full.service
    - pgbackrest-full.timer
  notify: systemd daemon-reload

- name: Enable pgBackRest backup timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - pgbackrest-diff.timer
    - pgbackrest-full.timer

# --- pg_dump prune timer ------------------------------------------------------
- name: Install pg-dump-prune script (canonical copy in src/systemd/)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/systemd/pg-dump-prune.sh"
    dest: /usr/local/sbin/pg-dump-prune.sh
    owner: root
    group: root
    mode: "0755"

- name: Install pg-dump-prune units (canonical copies in src/systemd/)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pg-dump-prune.service
    - pg-dump-prune.timer
  notify: systemd daemon-reload

- name: Enable pg-dump-prune timer
  ansible.builtin.systemd:
    name: pg-dump-prune.timer
    enabled: true
    state: started
    daemon_reload: true

# --- pgBackRest backup-age metric (docs/01 ADR 114) ---------------------------
# Writes pgbackrest_last_backup_timestamp_seconds into node_exporter's textfile
# directory (roles/node-exporter); Prometheus alerts when it goes stale.
- name: Install jq (parses pgbackrest --output=json)
  ansible.builtin.apt:
    name: jq
    state: present

- name: Install pgbackrest-textfile script (canonical copy in src/systemd/)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/systemd/pgbackrest-textfile.sh"
    dest: /usr/local/sbin/pgbackrest-textfile.sh
    owner: root
    group: root
    mode: "0755"

- name: Install pgbackrest-textfile units (canonical copies in src/systemd/)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pgbackrest-textfile.service
    - pgbackrest-textfile.timer
  notify: systemd daemon-reload

- name: Enable pgbackrest-textfile timer
  ansible.builtin.systemd:
    name: pgbackrest-textfile.timer
    enabled: true
    state: started
    daemon_reload: true
