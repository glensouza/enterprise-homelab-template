---
# Installs Caddy from Debian's own trixie-backports (2.11.x). Trixie stable ships
# 2.6.2, which predates `tls_trust_pool` (2.8) used by every Caddyfile here, so the
# backports build is required - still a Debian-signed package, no third-party repo
# (the Cloudsmith one started returning 402, ADR 110/111). Included by every role
# that fronts a service with Caddy.
- name: Enable Debian backports
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian-backports.sources
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: {{ ansible_distribution_release }}-backports
      Components: main
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    mode: "0644"

# apt validates default_release BEFORE update_cache runs, so the new index must be fetched first
# (failed on patchmon: "trixie-backports is invalid for APT::Default-Release").
- name: Refresh apt so the backports index is known
  ansible.builtin.apt:
    update_cache: true

- name: Install Caddy from backports
  ansible.builtin.apt:
    name: caddy
    default_release: "{{ ansible_distribution_release }}-backports"
    state: present
