---
# Installs Caddy from a pinned GitHub release .deb (same package, same systemd unit and
# `caddy` user as the old Cloudsmith repo). Included by every role that fronts a service
# with Caddy. Also removes the dead Cloudsmith repo left on already-converged hosts.

- name: Remove the retired Caddy apt repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy-stable.list
    - /etc/apt/sources.list.d/dl_cloudsmith_io_public_caddy_stable_deb_debian.list
    - /etc/apt/keyrings/caddy-stable.asc

- name: Download the pinned Caddy .deb
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_amd64.deb"
    dest: "/var/cache/caddy_{{ caddy_version }}_linux_amd64.deb"
    checksum: "sha512:{{ caddy_deb_sha512 }}"
    mode: "0644"

- name: Install Caddy
  ansible.builtin.apt:
    deb: "/var/cache/caddy_{{ caddy_version }}_linux_amd64.deb"
    state: present
