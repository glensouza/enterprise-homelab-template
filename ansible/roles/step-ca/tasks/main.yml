---
# Installs smallstep step-ca with an ACME provisioner (ADR 20, docs/11).
# The CA issues short-lived certificates for pr-*.{{ preview_domain }} so
# every PR preview gets trusted HTTPS with zero public exposure. Clients must
# trust the root CA once (docs/11 section 4).
- name: Download step-cli and step-ca packages
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  # Asset filenames embedding the version (step-cli_X.Y.Z_amd64.deb) gained a
  # package-revision suffix upstream (step-cli_X.Y.Z-1_amd64.deb) and 404'd -
  # confirmed live. Each release tag also publishes an unversioned filename
  # (step-cli_amd64.deb) at that same tagged URL, so the version pin (via the
  # URL path) survives future revision-suffix churn.
  loop:
    - { url: "https://github.com/smallstep/cli/releases/download/v{{ step_cli_version }}/step-cli_amd64.deb", dest: /tmp/step-cli.deb }
    - { url: "https://github.com/smallstep/certificates/releases/download/v{{ step_ca_version }}/step-ca_amd64.deb", dest: /tmp/step-ca.deb }

- name: Install step-cli and step-ca
  ansible.builtin.apt:
    deb: "{{ item }}"
    state: present
  loop:
    - /tmp/step-cli.deb
    - /tmp/step-ca.deb

- name: Store the CA key password
  ansible.builtin.copy:
    dest: /root/.step-ca-password
    content: "{{ step_ca_password }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# --- The CA survives a rebuild (docs/01 ADR 126) ---------------------------------------------------------
# `step ca init` mints a new root every time it runs on a fresh LXC, which made every `terraform destroy`
# invalidate the root each client machine had been told to trust. The CA's state (root + intermediate
# certificates and keys, ca.json, templates - not the issued-certificate database) is therefore saved on the
# controller, outside git and outside anything a destroy touches (next to the CA password it is encrypted
# with, ADR 35), and restored here before `step ca init` would run; init then sees ca.json and skips.
- name: Look for a saved copy of the CA on the controller
  ansible.builtin.stat:
    path: /opt/ansible-credentials/step-ca/step-ca-state.tgz
  delegate_to: localhost
  become: false
  register: step_ca_saved

- name: Restore the saved CA into /root/.step
  when: step_ca_saved.stat.exists
  block:
    - name: Create /root/.step
      ansible.builtin.file:
        path: /root/.step
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Unpack the saved CA (creates keeps ca.json from being overwritten on later runs)
      ansible.builtin.unarchive:
        src: /opt/ansible-credentials/step-ca/step-ca-state.tgz
        dest: /root/.step
        creates: /root/.step/config/ca.json

    - name: Create the (empty) certificate database directory
      ansible.builtin.file:
        path: /root/.step/db
        state: directory
        owner: root
        group: root
        mode: "0700"

- name: Initialize step-ca with an ACME provisioner (first run only)
  ansible.builtin.command: >
    step ca init
    --name "{{ step_ca_name }}"
    --dns "{{ step_ca_dns_names }}"
    --address ":{{ step_ca_port }}"
    --provisioner admin
    --password-file /root/.step-ca-password
    --acme
  args:
    creates: /root/.step/config/ca.json

- name: Install step-ca.service (canonical copy lives in src/systemd/)
  # The step-ca .deb package ships only the binary - confirmed live, no
  # systemd unit at all ("Could not find the requested service step-ca").
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../src/systemd/step-ca.service"
    dest: /etc/systemd/system/step-ca.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start step-ca
  ansible.builtin.systemd:
    name: step-ca
    enabled: true
    state: started
    daemon_reload: true

- name: Fetch the root CA certificate to the Ansible controller
  # Consumed by the preview-host role (Caddy acme_ca_root) and by admins
  # installing the root into client trust stores (docs/11 section 4).
  # Absolute destination (ADR 35's same reasoning, extended to fetched
  # artifacts, not just generated credentials) - confirmed live this
  # session: a relative "fetched/..." path resolves independently per
  # clone, and this LXC has two (this manual one, and the GitHub Actions
  # runner's own _work checkout), so a fetch done from one clone was
  # invisible to a preview-host/cockpit role run from the other.
  ansible.builtin.fetch:
    src: /root/.step/certs/root_ca.crt
    dest: /opt/ansible-fetched/step-ca/root_ca.crt
    flat: true

- name: Save the CA on the controller so the next rebuild restores it (first creation only)
  when: not step_ca_saved.stat.exists
  block:
    - name: Archive the CA state (without the certificate database)
      ansible.builtin.command: tar -czf /root/step-ca-state.tgz --exclude=./db -C /root/.step .
      changed_when: true

    - name: Make sure the controller directory exists (0700, it will hold the CA's private keys)
      ansible.builtin.file:
        path: /opt/ansible-credentials/step-ca
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch the archive to the controller
      ansible.builtin.fetch:
        src: /root/step-ca-state.tgz
        dest: /opt/ansible-credentials/step-ca/step-ca-state.tgz
        flat: true

    - name: Restrict the saved archive to root
      ansible.builtin.file:
        path: /opt/ansible-credentials/step-ca/step-ca-state.tgz
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Remove the archive from the CA host
      ansible.builtin.file:
        path: /root/step-ca-state.tgz
        state: absent

  rescue:
    # A failed save must never fail the rebuild: the CA is up, only the persistence is lost (the next
    # rebuild then mints a new root and the operator re-imports it, as before ADR 126).
    - name: Warn that the CA could not be saved
      ansible.builtin.debug:
        msg: "WARNING: could not save the step-ca state to /opt/ansible-credentials/step-ca - the next rebuild will mint a new root CA (docs/01 ADR 126)."
# --- Fleet-wide Cockpit certificates (ADR 21) -------------------------------
# Caddy/ACME certs come from the separate "acme" provisioner, so widening the
# JWK provisioner's durations here does not affect the preview sites.

- name: Allow year-long leaf certificates from the admin provisioner
  ansible.builtin.command: >
    step ca provisioner update admin
    --x509-default-dur 8760h --x509-max-dur 8760h
    --password-file /root/.step-ca-password
  changed_when: false

- name: Restart step-ca to pick up the provisioner duration change
  # Confirmed live: step-ca loads ca.json once at startup and doesn't
  # hot-reload provisioner changes - without this, certificate issuance
  # below fails with "requested duration ... is more than the authorized
  # maximum certificate duration of 24h1m0s" (step ca init's default),
  # even though the update above reports success.
  ansible.builtin.systemd:
    name: step-ca
    state: restarted

- name: Wait for step-ca to accept connections after the restart
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ step_ca_port }}"
    timeout: 30

- name: Create the Cockpit certificate directory on the CA
  ansible.builtin.file:
    path: /root/cockpit-certs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Issue a per-host Cockpit certificate for every LXC
  # Signed centrally on the CA host — no firewall changes needed, and renewal
  # is simply re-running this playbook (certs are valid for 1 year).
  ansible.builtin.command: >
    step ca certificate {{ item }}.{{ internal_domain }}
    /root/cockpit-certs/{{ item }}.crt /root/cockpit-certs/{{ item }}.key
    --provisioner admin --password-file /root/.step-ca-password
    --not-after 8760h --force
  loop: "{{ groups['all'] }}"

# Cockpit's own cockpit-certificate-ensure helper wants separate .cert/.key
# files (confirmed live: "open: .../0-{{ internal_domain }}.key: No such
# file or directory") - it does NOT accept one combined PEM the way e.g.
# Caddy does, despite that being the more common convention. Fetched
# separately below; consumed by the cockpit role on each LXC.
- name: Fetch Cockpit certificates to the Ansible controller
  ansible.builtin.fetch:
    src: "/root/cockpit-certs/{{ item }}.crt"
    dest: "/opt/ansible-fetched/step-ca/cockpit/{{ item }}.crt"
    flat: true
  loop: "{{ groups['all'] }}"

- name: Fetch Cockpit keys to the Ansible controller
  ansible.builtin.fetch:
    src: "/root/cockpit-certs/{{ item }}.key"
    dest: "/opt/ansible-fetched/step-ca/cockpit/{{ item }}.key"
    flat: true
  loop: "{{ groups['all'] }}"

# ADR 41: Proxmox (pve1) and Kemp aren't Ansible-managed (no LXC, nothing to
# install a fetched cert onto automatically) - issued here the same way as
# Cockpit's certs, then fetched to the controller for the operator to
# manually upload into each device's own UI (Proxmox: Datacenter -> pve1 ->
# Certificates; Kemp: System Configuration -> Certificates -> Manage
# Certificates -> Import). Same 1-year lifetime as Cockpit's.
- name: Create the physical-host certificate directory on the CA
  ansible.builtin.file:
    path: /root/physical-host-certs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Issue a certificate for every physical/appliance host
  ansible.builtin.command: >
    step ca certificate {{ item.name }}.{{ internal_domain }}
    /root/physical-host-certs/{{ item.name }}.crt /root/physical-host-certs/{{ item.name }}.key
    --provisioner admin --password-file /root/.step-ca-password
    --not-after 8760h --force
  loop: "{{ dns_physical_host_records }}"

- name: Fetch physical-host certificates to the Ansible controller
  ansible.builtin.fetch:
    src: "/root/physical-host-certs/{{ item.name }}.crt"
    dest: "/opt/ansible-fetched/step-ca/physical/{{ item.name }}.crt"
    flat: true
  loop: "{{ dns_physical_host_records }}"

- name: Fetch physical-host keys to the Ansible controller
  ansible.builtin.fetch:
    src: "/root/physical-host-certs/{{ item.name }}.key"
    dest: "/opt/ansible-fetched/step-ca/physical/{{ item.name }}.key"
    flat: true
  loop: "{{ dns_physical_host_records }}"
