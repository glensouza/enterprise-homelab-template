---
# Installs Cockpit on every LXC (ADR 21) with a TLS certificate signed by the
# internal step-ca (generated by the step-ca role and fetched to the Ansible
# controller), so https://<host>.{{ internal_domain }}:9090 is a green
# padlock for every client that trusts the internal root CA.
- name: Install Cockpit
  ansible.builtin.apt:
    name: cockpit
    update_cache: true
    state: present

- name: Create the Cockpit certificate directory
  ansible.builtin.file:
    path: /etc/cockpit/ws-certs.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the step-ca certificate and key for this host
  # Cockpit's cockpit-certificate-ensure helper wants separate .cert/.key
  # files, not one combined PEM - confirmed live ("open: .../0-{{
  # internal_domain }}.key: No such file or directory"). Renewal = re-run
  # the playbook (certs last 1 year).
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/fetched/step-ca/cockpit/{{ inventory_hostname }}.{{ item.ext }}"
    dest: "/etc/cockpit/ws-certs.d/0-{{ internal_domain }}.{{ item.dest_ext }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { ext: crt, dest_ext: cert }
    - { ext: key, dest_ext: key }
  notify: Restart cockpit

- name: Enable and start Cockpit
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
