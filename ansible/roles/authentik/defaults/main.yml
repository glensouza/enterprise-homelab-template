---
# Pinned release - github.com/goauthentik/authentik/releases. Bump
# deliberately, not automatically (same discipline as
# garnet_version/step_ca_version/step_cli_version). Matches the exact
# version community-scripts' authentik-install.sh targets, confirmed
# against its own AUTHENTIK_VERSION at the pinned commit this role's
# install sequence is based on (docs/01 ADR 59).
authentik_version: "2026.8.3"
xmlsec_version: "1.3.12"
nodejs_major_version: "26"
python_version: "3.14.7"

authentik_http_port: 9000
authentik_https_port: 9443
authentik_worker_http_port: 8000
authentik_worker_https_port: 8443

# Redis-protocol backend - the existing Garnet LXC (docs/01 ADR 59), not a
# dedicated Redis instance. db 0/1 mirror Authentik's own docker-compose.yml
# convention (separate DBs for cache vs. the websocket/event channel).
authentik_redis_cache_db: 0
authentik_redis_channel_db: 1
