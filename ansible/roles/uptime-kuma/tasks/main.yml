---
# STUB (DEMO-AUDIT.md R7 sibling gap — "Add observability and uptime-kuma
# Ansible roles"). Native install (ADR 02 — no Docker in the homelab):
# Node.js LTS from NodeSource, Uptime Kuma from its upstream git repo, run
# under a systemd unit — no pm2, to match every other role's pattern in this
# repo. Configuring actual monitors is on-camera content for whichever
# episode covers it; this just gets a real status page running.

- name: Install apt prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, gnupg]
    update_cache: true
    state: present

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the NodeSource apt GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: "0644"

- name: Dearmor the NodeSource apt GPG key
  ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Add the NodeSource apt repository (Node.js {{ nodejs_major_version }}.x)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    update_cache: true
    state: present

- name: Create uptime-kuma system user
  ansible.builtin.user:
    name: uptime-kuma
    system: true
    shell: /usr/sbin/nologin
    home: /opt/uptime-kuma
    create_home: false

# "Own the install directory" below chows /opt/uptime-kuma away from root
# (the remote_user git runs as), so every re-run after the first hits git's
# dubious-ownership check - confirmed live: "detected dubious ownership in
# repository at '/opt/uptime-kuma'".
- name: Mark /opt/uptime-kuma as a safe git directory for root
  ansible.builtin.command: git config --global --add safe.directory /opt/uptime-kuma
  changed_when: false

- name: Clone Uptime Kuma
  ansible.builtin.git:
    repo: https://github.com/louislam/uptime-kuma.git
    dest: /opt/uptime-kuma
    version: "{{ uptime_kuma_version }}"
  register: uptime_kuma_clone

- name: Run Uptime Kuma setup (npm install + frontend build)
  ansible.builtin.command: npm run setup
  args:
    chdir: /opt/uptime-kuma
  when: uptime_kuma_clone.changed

- name: Own the install directory
  ansible.builtin.file:
    path: /opt/uptime-kuma
    owner: uptime-kuma
    group: uptime-kuma
    recurse: true

- name: Install the systemd unit
  ansible.builtin.template:
    src: uptime-kuma.service.j2
    dest: /etc/systemd/system/uptime-kuma.service
    mode: "0644"
  notify: [systemd daemon-reload, restart uptime-kuma]

- name: Flush handlers so the unit is loaded before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start Uptime Kuma
  ansible.builtin.systemd:
    name: uptime-kuma
    enabled: true
    state: started
    daemon_reload: true

# --- Seed monitors as code (docs/01 ADR 60) -----------------------------------
# Skips gracefully (same idiom as the technitium role) until
# uptime_kuma_username/uptime_kuma_password are supplied - this instance's
# admin account was created by hand through Kuma's own first-run wizard
# (its password is the operator's personal choice, not something Ansible
# should generate or ever see typed into a field), so seeding can only run
# once those are placed in /opt/ansible-secrets/all.yml (ADR 36) directly by
# whoever completed that wizard.
- name: Install python3-venv (needed for the monitor-seeding script)
  # Confirmed live: plain `python3-venv` isn't sufficient on this Debian 12
  # template - venv creation fails with "ensurepip is not available" until
  # the version-specific package (matching the system's actual python3.11)
  # is installed explicitly.
  ansible.builtin.apt:
    name: python3.11-venv
    state: present
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

- name: Create a venv for the monitor-seeding script
  ansible.builtin.command: python3 -m venv /opt/uptime-kuma-seed
  args:
    creates: /opt/uptime-kuma-seed/bin/python
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

- name: Install uptime-kuma-api (pinned - see seed_monitors.py for why its
    add_monitor() can't be used as-is against Kuma 2.x)
  ansible.builtin.pip:
    name: uptime-kuma-api==1.2.1
    virtualenv: /opt/uptime-kuma-seed
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

- name: Copy the monitor-seeding script
  ansible.builtin.copy:
    src: seed_monitors.py
    dest: /opt/uptime-kuma-seed/seed_monitors.py
    mode: "0644"
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

- name: Render the desired monitor list
  ansible.builtin.copy:
    content: "{{ uptime_kuma_monitors | to_nice_json }}"
    dest: /opt/uptime-kuma-seed/monitors.json
    mode: "0644"
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

- name: Seed any missing monitors and reconcile url/hostname/port drift
  ansible.builtin.command: /opt/uptime-kuma-seed/bin/python /opt/uptime-kuma-seed/seed_monitors.py /opt/uptime-kuma-seed/monitors.json
  environment:
    UPTIME_KUMA_URL: "http://localhost:{{ uptime_kuma_port | default(3001) }}"
    UPTIME_KUMA_USERNAME: "{{ uptime_kuma_username }}"
    UPTIME_KUMA_PASSWORD: "{{ uptime_kuma_password }}"
  register: seed_result
  changed_when: >-
    (seed_result.stdout | from_json).added | length > 0
    or (seed_result.stdout | from_json).updated | length > 0
  no_log: true
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

# --- Fleet-wide maintenance-mode toggle (docs/01 ADR 86) ----------------------
# Lets patch-fleet.yml/deploy-blazor.yml (via the kuma-maintenance-on/-off
# composite actions) mute the status page for the duration of a run, the
# same idea as app_offline.htm for the web tier itself - see
# toggle_maintenance.py's own header for why. Reuses the venv/library
# already installed above for monitor seeding; same gate.
- name: Copy the maintenance-toggle script
  ansible.builtin.copy:
    src: toggle_maintenance.py
    dest: /opt/uptime-kuma-seed/toggle_maintenance.py
    mode: "0644"
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

# root-only (0600): the one place this repo puts a plaintext credential down
# as a file on disk rather than passing it only through Ansible's own
# `environment:` block (seed_monitors.py above) - needed because the
# kuma-maintenance-on/-off composite actions invoke this script as a plain
# SSH command from the self-hosted runner, not through ansible-playbook, so
# there's no `-e @/opt/ansible-secrets/all.yml` available at that call site.
- name: Render the maintenance-toggle script's credentials file
  ansible.builtin.copy:
    content: |
      UPTIME_KUMA_URL=http://localhost:{{ uptime_kuma_port | default(3001) }}
      UPTIME_KUMA_USERNAME={{ uptime_kuma_username }}
      UPTIME_KUMA_PASSWORD={{ uptime_kuma_password }}
    dest: /opt/uptime-kuma-seed/.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: uptime_kuma_username is defined and uptime_kuma_password is defined

# Tier-2 forward-auth (docs/01 ADR 66).
- name: Front Uptime Kuma with Caddy + Authentik forward-auth
  ansible.builtin.include_role:
    name: caddy-forward-auth
  vars:
    caddy_fa_fqdn: "kuma.{{ internal_domain }}"
    caddy_fa_backend: "127.0.0.1:{{ uptime_kuma_port | default(3001) }}"
