---
# Installs Technitium DNS Server (ADR 20, docs/11). One wildcard record
# (*.{{ preview_domain }} -> {{ preview_host_ip }}) covers every PR preview,
# so CI never has to create or delete DNS records.
- name: Check whether Technitium is already installed
  ansible.builtin.stat:
    path: /etc/dns
  register: technitium_dir

- name: Install curl (install.sh shells out to it for the ASP.NET runtime download)
  ansible.builtin.apt:
    name: curl
    update_cache: true
    state: present
  when: not technitium_dir.stat.exists

- name: Download the Technitium install script
  ansible.builtin.get_url:
    url: https://download.technitium.com/dns/install.sh
    dest: /tmp/technitium-install.sh
    mode: "0755"
  when: not technitium_dir.stat.exists

- name: Run the Technitium install script
  ansible.builtin.command: /tmp/technitium-install.sh
  when: not technitium_dir.stat.exists

- name: Enable and start Technitium DNS
  ansible.builtin.systemd:
    name: dns
    enabled: true
    state: started

# ADR 31: self-bootstrap via the API's own default admin/admin login, so
# secrets.yml doesn't have to be hand-populated from a manually-created UI
# token before Ansible can manage zones at all. Only attempted when
# technitium_api_token wasn't already supplied - confirmed live this session
# that a 401 here (default password already changed by hand, as this LXC's
# own instance already was) fails gracefully and falls through to the
# existing manual-token path below, unchanged.
- name: "Bootstrap: create an API token using the default admin/admin login"
  ansible.builtin.uri:
    url: "http://localhost:5380/api/user/createToken?user=admin&pass=admin&tokenName=ansible-bootstrap"
    method: GET
    status_code: [200, 401]
  register: technitium_bootstrap_token
  when: technitium_api_token is not defined
  no_log: true

- name: "Bootstrap: change the default admin password"
  ansible.builtin.uri:
    url: "http://localhost:5380/api/user/changePassword?pass=admin&newPass={{ technitium_admin_password }}"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_bootstrap_token.json.token }}"
    status_code: 200
  when: >
    technitium_api_token is not defined and
    technitium_bootstrap_token.json is defined and
    technitium_bootstrap_token.json.status | default('') == 'ok'
  no_log: true

- name: "Bootstrap: use the new token for the rest of this run"
  ansible.builtin.set_fact:
    technitium_api_token: "{{ technitium_bootstrap_token.json.token }}"
  when: >
    technitium_api_token is not defined and
    technitium_bootstrap_token.json is defined and
    technitium_bootstrap_token.json.status | default('') == 'ok'
  no_log: true

- name: "Bootstrap: tell the operator to save the token for future runs"
  ansible.builtin.debug:
    msg: >-
      Technitium bootstrapped automatically. Save this token to
      ansible/inventory/group_vars/dns/secrets.yml as technitium_api_token
      so future runs don't need to bootstrap again -
      {{ technitium_bootstrap_token.json.token }}
  when: >
    technitium_api_token is defined and
    technitium_bootstrap_token is defined and
    technitium_bootstrap_token.json is defined and
    technitium_bootstrap_token.json.status | default('') == 'ok'

# Zone management is API-driven. Set technitium_api_token (create one in the
# Technitium web UI on http://10.10.130.119:5380 after changing the default
# admin password) to let Ansible create the zone + wildcard record - or let
# the bootstrap above do it automatically on a fresh instance.
- name: Create the preview zone
  ansible.builtin.uri:
    url: "http://localhost:5380/api/zones/create?token={{ technitium_api_token }}&zone={{ preview_domain }}&type=Primary"
    method: GET
    status_code: 200
  when: technitium_api_token is defined

- name: Add the wildcard A record pointing at the preview host
  ansible.builtin.uri:
    url: "http://localhost:5380/api/zones/records/add?token={{ technitium_api_token }}&domain=*.{{ preview_domain }}&type=A&zone={{ preview_domain }}&ipAddress={{ preview_host_ip }}&overwrite=true"
    method: GET
    status_code: 200
  when: technitium_api_token is defined

# --- Lab zone (ADR 21): per-host A records + friendly service CNAMEs --------
- name: Create the lab zone
  ansible.builtin.uri:
    url: "http://localhost:5380/api/zones/create?token={{ technitium_api_token }}&zone={{ internal_domain }}&type=Primary"
    method: GET
    status_code: 200
  when: technitium_api_token is defined

- name: Add a per-host A record for every LXC
  ansible.builtin.uri:
    url: "http://localhost:5380/api/zones/records/add?token={{ technitium_api_token }}&domain={{ item }}.{{ internal_domain }}&type=A&zone={{ internal_domain }}&ipAddress={{ hostvars[item].ansible_host }}&overwrite=true"
    method: GET
    status_code: 200
  loop: "{{ groups['all'] }}"
  when: technitium_api_token is defined

- name: Add friendly service CNAME records
  ansible.builtin.uri:
    url: "http://localhost:5380/api/zones/records/add?token={{ technitium_api_token }}&domain={{ item.name }}.{{ internal_domain }}&type=CNAME&zone={{ internal_domain }}&cname={{ item.target }}.{{ internal_domain }}&overwrite=true"
    method: GET
    status_code: 200
  loop: "{{ dns_service_cnames }}"
  when: technitium_api_token is defined
