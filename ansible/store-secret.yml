---
# One-off: push a manually-supplied secret into Infisical by name. Use for
# credentials that don't come from an Ansible-generated password (e.g. the
# devops LXC's own root password, set by hand at `pct create` and never
# tracked anywhere - LAB-RUNBOOK.md DevOps LXC section, docs/01 ADR 82).
# Prompts for the value interactively (echo off, no_log throughout) so it's
# never typed on the command line, logged, or committed anywhere.
#
# Run from the devops LXC itself:
#   ansible-playbook store-secret.yml -e @/opt/ansible-secrets/all.yml -e infisical_secret_name=<NAME>
- name: Push a manually-supplied secret into Infisical
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Prompt for the value of {{ infisical_secret_name }}"
      ansible.builtin.pause:
        prompt: "Value for {{ infisical_secret_name }}"
        echo: false
      register: secret_prompt
      no_log: true

    - name: "Push {{ infisical_secret_name }} to Infisical"
      ansible.builtin.include_role:
        name: infisical-secret
      vars:
        infisical_secret_value: "{{ secret_prompt.user_input }}"
      no_log: true
