[defaults]
# Static inventory (inventory/hosts.yml) + Terraform-generated overlay
# (inventory/terraform-hosts.yml) — both are loaded from this directory.
inventory = inventory/
remote_user = root
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False

[privilege_escalation]
become = False
# Ansible's default become_method is sudo, but these minimal Debian LXC
# images don't have sudo installed at all (confirmed live: "sudo: command
# not found" - same reason the runbook's manual psql commands use `su
# postgres -c` instead of `sudo -u postgres`). su works with no password
# prompt here since remote_user is root, which can switch to any user freely.
become_method = su
