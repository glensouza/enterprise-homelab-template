# Per-PR preview stack template (ADR 19, docs/11).
# Rendered by .github/workflows/pr-preview.yml: the workflow writes an .env
# file (PR_NUMBER, APP_IMAGE, APP_PORT, DB_PORT, DB_PASSWORD, FLOCI_PORT,
# FLOCI_AZ_PORT, FLOCI_GCP_PORT, FLOCI_OCI_PORT) next to this file under
# /opt/previews/pr-<n>/ on the preview host and runs
# `docker compose --env-file .env up -d`. Never commit real values.
name: pr-${PR_NUMBER}

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      ConnectionStrings__brewhousedb: Host=db;Port=5432;Database=brewhouse_pr${PR_NUMBER};Username=brewhouse;Password=${DB_PASSWORD}
      ConnectionStrings__cache: cache:6379
      ConnectionStrings__messaging: amqp://guest:guest@messaging:5672
      # Preview runs the S3 path (ADR 03) against the Floci AWS emulator below, so every
      # PR exercises S3BlobStore for real instead of the local-disk implementation that
      # production uses. Credentials are the emulator's fixed test pair, not secrets.
      BlobStorage__Provider: s3
      BlobStorage__S3__ServiceUrl: http://floci:4566
      BlobStorage__S3__ForcePathStyle: "true"
      BlobStorage__S3__BucketName: brewhouse-auction-pr${PR_NUMBER}
      BlobStorage__S3__AccessKey: test
      BlobStorage__S3__SecretKey: test
      BlobStorage__RootPath: /data/blobs
      # Keep the circuit's own hub connection on this container instead of routing it
      # back out through Caddy (see SignalRBidsClient).
      Realtime__HubBaseUrl: http://localhost:8080
      # To exercise the SQS transport (ADR 07) on a branch, add:
      #   Messaging__Transport: sqs
      #   Messaging__Sqs__ServiceUrl: http://floci:4566
    # Loopback-only: external traffic enters via Caddy on 443.
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      messaging:
        condition: service_started
      floci-init:
        condition: service_completed_successfully
    volumes:
      - blobs:/data

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
    environment:
      POSTGRES_DB: brewhouse_pr${PR_NUMBER}
      POSTGRES_USER: brewhouse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Loopback-only, for the EF migration bundle executed on the host by CI.
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewhouse -d brewhouse_pr${PR_NUMBER}"]
      interval: 5s
      timeout: 3s
      retries: 12

  cache:
    image: ghcr.io/microsoft/garnet:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  messaging:
    image: rabbitmq:3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Floci multi-cloud emulators (S2-01/S2-09): ephemeral, memory-mode, no
  # Docker socket - unlike the standing Floci stack (ansible/roles/preview-host,
  # ../../floci/README.md), a per-PR stack must not hand an untrusted PR branch
  # access to the host Docker daemon (ADR 19's per-PR isolation model), so the
  # Lambda/RDS/ECS-class features that need the socket are unavailable here;
  # object storage (S3BlobStore) and SQS transport demos don't need them.
  floci:
    image: floci/floci:latest
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:${FLOCI_PORT}:4566"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # One-shot: S3BlobStore never creates buckets (real S3 rarely grants CreateBucket to
  # an app identity), so the per-PR bucket has to exist before the app starts.
  floci-init:
    image: amazon/aws-cli:latest
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until aws --endpoint-url http://floci:4566 s3 mb s3://brewhouse-auction-pr${PR_NUMBER} 2>/dev/null
         || aws --endpoint-url http://floci:4566 s3 ls s3://brewhouse-auction-pr${PR_NUMBER} >/dev/null 2>&1; do
        echo "waiting for the floci AWS emulator..."; sleep 2;
      done; echo "bucket brewhouse-auction-pr${PR_NUMBER} ready"
    depends_on:
      - floci

  floci-az:
    image: floci/floci-az:latest
    restart: unless-stopped
    environment:
      FLOCI_AZ_HOSTNAME: floci-az
      FLOCI_AZ_BASE_URL: http://floci-az:4577
    ports:
      - "127.0.0.1:${FLOCI_AZ_PORT}:4577"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  floci-gcp:
    image: floci/floci-gcp:latest
    restart: unless-stopped
    environment:
      FLOCI_GCP_HOSTNAME: floci-gcp
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      FLOCI_GCP_DEFAULT_PROJECT_ID: floci-local
    ports:
      - "127.0.0.1:${FLOCI_GCP_PORT}:4588"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  floci-oci:
    image: floci/floci-oci:latest
    restart: unless-stopped
    environment:
      FLOCI_OCI_HOSTNAME: floci-oci
    ports:
      - "127.0.0.1:${FLOCI_OCI_PORT}:4599"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  pgdata:
  blobs:
